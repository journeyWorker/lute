enums:
  emotion: [neutral, happy, worried, angry, hopeful, sad, surprised]
  costume: [plain, coat, raincloak, uniform]
  mood: [calm, tense, hopeful, sad, triumphant]
  volume: [silent, quiet, normal, loud, full]
  musicPlayback: { members: [start, change, stop, fadeOut], stops: [stop, fadeOut] }
  vfxType: [flash, shake]
  framing: [wide, close]
  cameraMove: [shake, pushIn]
  transition: [fade, dissolve, wipeLeft]
  cgLayout: [full, inset]
  textStyle: [emphasis, whisper]
  anchor:
    members: [left, center, right]
    default: center
  action:
    members: [fadeIn, fadeOut, hop, shake]
    exits: [fadeOut]
