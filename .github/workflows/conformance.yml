name: conformance

# On a PR branch the `pull_request` run covers each push; `push` is kept for
# main only, so a PR push no longer runs the harness twice.
on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  cel-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: conformance/harness/js/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: conformance/harness/go/go.sum
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: conformance-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: conformance-cargo-${{ runner.os }}-
      - name: Build lute-cli
        run: cargo build -q -p lute-cli
      - name: Install JavaScript harness
        working-directory: conformance/harness/js
        run: npm ci
      - name: Run Lute and both CEL harnesses
        run: conformance/harness/run.sh
