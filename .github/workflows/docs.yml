name: Docs

# Documentation-surface gate. Runs on PRs that touch the website, docs,
# schemas, or the two crate files that own the canonical version strings.
# Three jobs:
#   consistency — stdlib-python single-source version/domain drift guard.
#   examples    — build lute-cli, `check-project` the example roots, and
#                 compile-check every declared-checkable ```lute snippet in
#                 BOTH doc trees (packages/website/src/content/docs and
#                 docs/), so a doc example or a doc SNIPPET that stops
#                 matching its declared outcome fails the PR. `docs/**` is in
#                 the trigger paths below, so it has to be a root here too —
#                 a trigger that fires on files nothing reads advertises
#                 coverage it does not provide.
#   website     — build the Astro/Starlight site under Bun so a broken page
#                 or link is caught before merge.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/website/**"
      - "docs/**"
      - "schemas/**"
      - "crates/lute-check/src/lib.rs"
      - "crates/lute-compile/src/lib.rs"
      - "scripts/check-docs-consistency.py"
      - "scripts/check-doc-snippets.py"
      - ".github/workflows/docs.yml"

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  consistency:
    name: Docs consistency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Single-source drift guard: fails if the website's version claims
      # drift from the crate consts, an IR schema is missing, or a stale
      # canonical domain leaks in. Dependency-free (stdlib python3).
      - name: Check docs consistency
        run: python3 scripts/check-docs-consistency.py

  examples:
    name: Check example projects and doc snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: lute-docs-examples-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build lute-cli
        run: cargo build -q -p lute-cli

      # docs/examples checks cleanly end-to-end (warnings only, exit 0). The
      # bundled example roots are authored to pass `check-project`; a
      # regression that turns any of them into an Error-severity failure
      # (exit 1) fails this job.
      - name: check-project docs/examples
        run: cargo run -q -p lute-cli -- check-project docs/examples

      # A doc's ```lute blocks are source too, and until now nothing ever ran a
      # checker over them: the `website` job builds pages, not snippets, and
      # `check-project` above reads only docs/examples. Reuses the lute-cli
      # built above rather than cold-building the workspace in a job of its
      # own.
      #
      # The unit of verification is a block PAIRED WITH ITS EXPECTED OUTCOME,
      # declared in the fence meta: `check` / `check="<path>"` (must be clean,
      # standalone or inside that path's project) or `expect="<CODE>,…"` (must
      # fail with exactly those codes — this is what makes a tutorial's
      # deliberately-failing intermediate states verifiable). `unverified=`
      # opts out with a reason. Every skip is named in the output, and two
      # one-directional counters fail if a marker is quietly dropped or a new
      # unmarked whole document appears. Also pins the docs' quoted
      # `capabilityVersion` hashes against `lute context --json`.
      - name: Compile-check ```lute snippets in both doc trees
        run: python3 scripts/check-doc-snippets.py --lute ./target/debug/lute

  website:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # A missing syntax highlighter is only a WARNING to expressive-code: the
      # block still renders, silently unhighlighted. That is how every ```lute
      # block on the site sat as plain text until 0.8.0. Fail on it instead.
      - name: Build website (no silent highlighter fallback)
        working-directory: packages/website
        run: |
          set -euo pipefail
          bun run build 2>&1 | tee /tmp/website-build.log
          if grep -q "The language could not be found" /tmp/website-build.log; then
            echo "::error::a fenced code block fell back to plaintext - register its grammar in astro.config.mjs"
            grep "The language could not be found" /tmp/website-build.log | sort -u
            exit 1
          fi
