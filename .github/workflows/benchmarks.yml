name: Benchmarks

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.*"
      - "docs/examples/games/ledger/**"
      - "docs/examples/games/drowned-crown/**"
      - "docs/examples/games/monster-league/**"
      - "scripts/bench-ab.py"
      - "scripts/compare-bench.py"
      - ".github/workflows/benchmarks.yml"

# A new push supersedes an older benchmark run for the same pull request.
concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TARGET_DIR: ${{ runner.temp }}/lute-bench-target

jobs:
  benchmark:
    name: A/B benchmark gate
    runs-on: ubuntu-latest
    steps:
      - name: Start benchmark timer
        id: timer
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Fetch both revisions so the merge-base worktree can be created locally.
      - name: Check out pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # One toolchain for both revisions within the job; matches the other
      # workflows.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and benchmark target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ runner.temp }}/lute-bench-target
          key: lute-bench-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lute-bench-${{ runner.os }}-

      - name: Create merge-base worktree
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base_root="$RUNNER_TEMP/lute-bench-base"
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git worktree add --detach "$base_root" "$merge_base"
          echo "root=$base_root" >> "$GITHUB_OUTPUT"
          if [[ -f "$base_root/crates/lute-bench/Cargo.toml" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Merge base has no crates/lute-bench; running a head-only benchmark."
          fi

      - name: Build benchmark at merge base
        if: steps.base.outputs.available == 'true'
        working-directory: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          cargo build --locked --release -p lute-bench
          cp "$CARGO_TARGET_DIR/release/lute-bench" "$RUNNER_TEMP/lute-bench-base"

      - name: Build benchmark at pull request head
        run: |
          set -euo pipefail
          cargo build --locked --release -p lute-bench
          cp "$CARGO_TARGET_DIR/release/lute-bench" "$RUNNER_TEMP/lute-bench-head"

      - name: Collect head-only benchmark (new harness)
        if: steps.base.outputs.available != 'true'
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/lute-bench-reports"
          mkdir -p "$report_dir"
          echo "::notice::Benchmark comparison skipped because the merge base lacks lute-bench."
          "$RUNNER_TEMP/lute-bench-head" \
            --root . --tier all --phase all --samples 7 \
            --json "$report_dir/head.json"

      - name: Collect interleaved base/head samples
        if: steps.base.outputs.available == 'true'
        run: |
          set -euo pipefail
          python3 scripts/bench-ab.py \
            --base "$RUNNER_TEMP/lute-bench-base" \
            --base-root "${{ steps.base.outputs.root }}" \
            --head "$RUNNER_TEMP/lute-bench-head" \
            --head-root . \
            --samples 7 \
            --out "$RUNNER_TEMP/lute-bench-reports"

      - name: Compare benchmark reports
        id: compare
        if: steps.base.outputs.available == 'true'
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/lute-bench-reports"
          python3 scripts/compare-bench.py \
            "$RUNNER_TEMP/lute-bench-reports/base.json" \
            "$RUNNER_TEMP/lute-bench-reports/head.json" \
            2>&1 | tee "$RUNNER_TEMP/lute-bench-reports/comparison.txt"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      # Ratio failures can be waived only as an auditable exception: the
      # `performance-approved` label (applied by a maintainer) plus a PR-body
      # note naming the affected cell, e.g. `performance-approved:
      # large/analysis`. Reports stay uploaded below either way.
      - name: Enforce benchmark gate or approved exception
        if: steps.base.outputs.available == 'true' && steps.compare.outputs.status != '0'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PERFORMANCE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'performance-approved') }}
        run: |
          set -euo pipefail
          status="${{ steps.compare.outputs.status }}"
          if [[ "$status" != "1" ]]; then
            echo "Benchmark collection/comparison failed; only a ratio failure can use the exception." >&2
            exit 1
          fi
          if [[ "$PERFORMANCE_APPROVED" != "true" ]]; then
            echo "A performance regression requires the performance-approved label." >&2
            exit 1
          fi
          if ! grep -Eiq 'performance-approved:[[:space:]]*(tiny|medium|large)/(cold-load|project-resolution|analysis|serialization|playback)' <<<"$PR_BODY"; then
            echo "The PR body must name an approved tier/phase (performance-approved: tier/phase)." >&2
            exit 1
          fi
          echo "::warning::Performance regression accepted under the performance-approved label and a tier/phase note."

      - name: Record benchmark duration
        if: always()
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/lute-bench-reports"
          mkdir -p "$report_dir"
          ended=$(date +%s)
          elapsed=$((ended - ${{ steps.timer.outputs.started }}))
          printf 'duration_seconds=%s\n' "$elapsed" | tee "$report_dir/duration.txt"

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lute-bench-${{ github.run_id }}
          path: ${{ runner.temp }}/lute-bench-reports
          if-no-files-found: warn
          retention-days: 30
