id: dialogue-ratio
target: scene
# A linear-VN norm: beats (scenes with `on:`), components, quests and lore are
# fragments whose ratio says nothing about pacing (dsl 0.22.0 §13).
when: 'scene.kind == "scene" && scene.bodyNodes >= options.minNodes && scene.dialogueRatio < options.min'
level: warn
message: "dialogue ratio {scene.dialogueRatio:%} below floor {options.min:%} ({scene.dialogueLines} lines / {scene.bodyNodes} body nodes)"
options:
  min: 0.35
  minNodes: 10
