[package]
name = "lute-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "lute"
path = "src/main.rs"

[dependencies]
lute-core-span = { path = "../lute-core-span" }
lute-manifest = { path = "../lute-manifest" }
lute-check = { path = "../lute-check" }
lute-syntax = { path = "../lute-syntax" }
lute-compile = { path = "../lute-compile" }
lute-load = { path = "../lute-load" }
lute-model = { path = "../lute-model" }
lute-semantic = { path = "../lute-semantic" }
lute-resolve = { path = "../lute-resolve" }
lute-trace = { path = "../lute-trace" }
lute-runtime = { path = "../lute-runtime" }
lute-cel = { path = "../lute-cel" }
lute-lint = { path = "../lute-lint" }
clap = { version = "4", features = ["derive"] }
cel-parser = "0.10.1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
rayon = "1.12"
