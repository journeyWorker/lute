# The workspace `clippy.toml` plus the raw filesystem probes (spec 0.53.0
# §3.5): this crate assembles the inputs the language server caches across
# requests, so every probe a memoized build makes is recorded. Keep the first
# two entries equal to `../../clippy.toml`.
disallowed-methods = [
  { path = "core::iter::Iterator::for_each", reason = "side effects belong in a `for` loop" },
  { path = "core::iter::Iterator::try_for_each", reason = "side effects belong in a `for` loop" },
  { path = "std::path::Path::is_file", reason = "input assembly probes the filesystem through `lute_manifest::deps::DependencySink`, so the language server's persistent cache records the probe (spec 0.53.0 §3.5); a site no memoized build reaches says so in an `#[expect]`" },
  { path = "std::path::Path::is_dir", reason = "input assembly probes the filesystem through `lute_manifest::deps::DependencySink`, so the language server's persistent cache records the probe (spec 0.53.0 §3.5); a site no memoized build reaches says so in an `#[expect]`" },
