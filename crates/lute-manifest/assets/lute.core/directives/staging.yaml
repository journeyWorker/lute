directives:
  - name: bg
    attrs:
      - { name: location, type: string }
      - { name: time, type: string }
      - { name: assetId, type: string }
    semantics: [ "mutatesScene" ]
    lower: { record: setBackground, fields: {} }
  - name: music
    attrs:
      - { name: playback, type: { domain: musicPlayback } }
      - { name: mood, type: { domain: mood } }
      - { name: volume, type: { domain: volume } }
      - { name: assetId, type: string }
    semantics: [ "mutatesScene" ]
    lower: { record: setMusic, fields: {} }
  - name: sfx
    attrs:
      - { name: sound, type: string }
      - { name: assetId, type: string }
    lower: { record: playSfx, fields: {} }
  - name: actor
    attrs:
      - { name: character, required: true, type: string }
      - { name: anchor, type: { domain: anchor } }
      - { name: action, type: { domain: action } }
      - { name: emotion, type: { domain: emotion } }
      - { name: costume, type: { domain: costume } }
    semantics: [ "reads.onStage", "usesAnchor", "mayExitCharacter", "writes.characterState" ]
    lower: { kind: builtin, name: actorStage }
  # dsl 0.24.0 §4: every character on stage exits. No attrs; the compiler
  # lowers it to one exit record per character it has on stage.
  - name: clear
    attrs: []
    semantics: [ "reads.onStage", "mayExitCharacter" ]
    lower: { kind: builtin, name: clearStage }
  - name: vfx
    attrs:
      - { name: type, type: { domain: vfxType } }
      - { name: label, type: string }
      - { name: transition, type: string }
    lower: { record: playVfx, fields: {} }
  - name: cg
    attrs:
      - { name: assetId, required: true, type: string }
      - { name: display, type: { enum: [show, hide] }, default: show }
      - { name: layout, type: { domain: cgLayout } }
    lower: { record: showCg, fields: {} }
  - name: video
    attrs:
      - { name: assetId, required: true, type: string }
      - { name: display, type: { enum: [show, hide] }, default: show }
      - { name: wait, type: bool, default: true }
    lower: { record: playVideo, fields: {} }
  # dsl 0.37.0 §3.3: camera values are project vocabulary. At least one of
  # `focus`/`framing`/`move`/`transition` is required (`E-CAMERA-EMPTY`).
  - name: camera
    attrs:
      - { name: focus, type: string }
      - { name: framing, type: { domain: framing } }
      - { name: move, type: { domain: cameraMove } }
      - { name: transition, type: { domain: transition } }
      - { name: duration, type: double }
      - { name: delay, type: double }
      - { name: wait, type: bool, default: false }
    lower: { kind: builtin, name: cameraTransform }
  # dsl 0.37.0 §3.3: a reference to a project-declared sequence, not an inline
  # cinematic.
  - name: sequence
    attrs:
      - { name: name, required: true, type: { domain: sequence } }
      - { name: wait, type: bool, default: true }
    lower: { kind: builtin, name: sequence }
  - name: end
    attrs:
      - { name: reason, required: false, type: string }
    semantics: [ "terminatesWalk" ]
    lower: { kind: builtin, name: end }
  - name: label
    attrs:
      - { name: name, required: true, type: string }
    lower: { kind: builtin, name: label }
  - name: jump
    attrs:
      - { name: to, required: true, type: string }
      - { name: when, required: false, type: string }
    lower: { kind: builtin, name: jump }
