# 23:00. The car, the gate, the lobby, Toby's lantern and the plaque.
steps:
  - occasion: nightFalls
    label: the car in the ambulance bay
    choose: { goIn: quiet }
    expect: { presented: [arrival], clock: { slot: h23 } }
  - occasion: read
    target: note.tobiasNote
  - occasion: enter
    target: room.lobby
    expect: { winner: room.lobby }
  # the engine puts the lantern in the bag and raises pickup
  - occasion: pickup
    engine: { facts: [holding(lantern)] }
    target: item.lantern
    expect: { winner: gotLantern, facts: [canEnter(boiler)] }
  - occasion: read
    target: note.plaque
