# The Ashfall, a live event, from a late save: the studio switches it on
# (engine-owned user.ashfallOn), Wren carries ash-lilies down (the runEnd
# payload), Maud's season quest completes, the event closes, and when it
# comes back the Hearth remembers how the last one ended (prev.season.*).
presented:
  user:
    - hearth.awakening
    - hearth.firstReturn
    - hearth.firstEscape
    - sky.letter
    - stair.firstClimb
    - end.firstFall
    - boss.gatekeeperFalls
    - boss.wardenFalls
    - maud.first
    - maud.count
    - maud.questions
    - oskar.first
    - oskar.hammerhead
    - oskar.afterForge
    - sable.first
    - sable.name
    - keepsakes.maud
    - keepsakes.oskar
    - keepsakes.sable
quests: { longClimb: complete, sableLost: complete, coldForge: complete }
state:
  user.runs: 6
  user.deaths: 4
  user.escapes: 2
  user.bond.maud: 5
  user.bond.oskar: 5
  user.bond.sable: 5
  user.knowsSableName: true
  user.hammerReforged: true
  prev.run.outcome: fell
  prev.run.floor: 7
  prev.run.fellTo: ashwraith
facts:
  - "everSlew(gatekeeper)"
  - "everSlew(warden)"
  - "saw(sable, wardenFall)"
  - "gave(maud, kettleLid)"
  - "gave(oskar, anvilSpark)"
  - "gave(sable, cisternGlass)"
choose:
  rack: leave
steps:
  # ── Run 7: the Ashfall comes down ──────────────────────────────────
  - label: the studio switches the Ashfall on
    engine:
      state: { user.ashfallOn: true }
  - occasion: hubVisit
    expect: { winner: hearth.ashfallOpens }
  - occasion: talk
    target: npc.maud
    label: "share: ashfallNews — the Hearth scene already told her, so Maud's Ashfall bark is spent too"
    expect: { winner: maudBarkWraith, notOffered: [maudBarkAshfall] }
  - occasion: hearthBoard
    pick: boardAshfall
    expect: { offered: [boardAshfall, boardFeather, boardTally, boardChores] }
  - occasion: departure
    expect: { presented: [stairDoor, sendOff, sendOff, sendOff] }
  - occasion: runStart
    expect: { presented: [stair.veteranEcho] }
  - label: a wraith on floor 6, two lilies in her pack
    engine:
      state: { run.floor: 6, run.outcome: fell, run.fellTo: ashwraith, user.runs: { add: 1 }, user.deaths: { add: 1 } }
  - occasion: runEnd
    payload: { lilies: 2 }
    expect: { presented: [fallAgain, end.lilies] }
  - newRun: true
  # ── Run 8: out, and one more lily by the door ─────────────────────
  - occasion: hubVisit
    expect: { winner: hearth.veteranWelcome, notOffered: [hearth.ashfallOpens] }
  - occasion: talk
    target: npc.maud
    expect: { winner: maudBarkWraith }
  - occasion: runStart
  - label: all the way out
    engine:
      state: { run.floor: 9, run.outcome: escaped, user.runs: { add: 1 }, user.escapes: { add: 1 } }
  - occasion: runEnd
    payload: { lilies: 0 }
    expect: { winner: end.escape, notOffered: [end.lilies] }
  - newRun: true
  # ── Between events ─────────────────────────────────────────────────
  - label: the Ashfall ends
    engine:
      state: { user.ashfallOn: false }
  - occasion: hubVisit
    expect: { winner: sky.kettleOutside }
  # ── The Ashfall comes back ─────────────────────────────────────────
  - label: the studio switches it on again
    engine:
      state: { user.ashfallOn: true }
  - occasion: hubVisit
    expect: { winner: hearth.ashfallOpens }
  - label: and off again before a single lily
    engine:
      state: { user.ashfallOn: false }
expect:
  end: complete
  quests: { lilies: failed }
  state:
    user.embers: 15
    user.bond.maud: 7
    season.ashfall.lilies: 0
    prev.season.ashfall.lilies: 3
  transcriptContains:
    - "it left her 2 ash-lilies, pressed flat in her pack."
    - "one grey lily has come up through the grass"
    - "Three. You counted."
    - "Last time you brought me 3 lilies."
    - "the lilies on the landings go back to being stone."
    - "Oskar looks up as she passes."
