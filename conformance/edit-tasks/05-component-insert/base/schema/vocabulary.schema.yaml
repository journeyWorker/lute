# Monster League — staging vocabulary. LEAD-OWNED: ask before adding members
# (a new emotion needs portrait art for every speaker that uses it).
enums:
  emotion: [neutral, happy, smug, angry, sad, surprised, determined, worried, laughing]
  anchor:
    members: [left, center, right]
    default: center
  action:
    members: [enter, bow, cheer, idle, exit]
    exits: [exit]
  mood: [calm, upbeat, tense, battle, eerie, triumphant, sad, festive]
  volume: [down, normal, up]
  musicAction: [start, change, stop, fadeOut]
  vfxType: [flash, whiteOut, blackOut, sparkle, rain, fog]
