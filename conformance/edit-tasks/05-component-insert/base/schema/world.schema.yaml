# Monster League — the world contract.
#
# LEAD-OWNED. Area writers read everything here and change nothing without
# the lead (see AREAS.md). The ENGINE executes battles, catching, the map,
# menus and money math; Lute declares what the story says, when, and what
# changes. Species live in species.schema.yaml, people and places in
# roster.schema.yaml, staging vocabulary in vocabulary.schema.yaml.

state:
  # ── the clock (engine-owned; Gold/Silver style morning / day / night) ──
  run.day:  { type: int, default: 1, owner: engine }
  run.slot: { type: { enum: [morning, day, night] }, default: morning, owner: engine }

  # ── the purse: prizes from content, MONEY rewards, shops and blackouts
  #    from the engine ──
  run.money: { type: int, default: 3000 }

  # ── rival standing: +1 for every rival battle won, -1 for every loss ──
  run.rivalStanding: { type: int, default: 0 }

  # ── Team Eclipse: one state per lair (hidden -> found -> cleared) ──
  run.lair: { type: { domain: lairState }, default: hidden, per: lair }

  # ── across saves ──
  user.hallOfFame: { type: int, default: 0 }

enums:
  lairState:
    members: [hidden, found, cleared]
    labels: { hidden: "not yet found", found: "found", cleared: "cleared" }

clock:
  day: run.day
  slot: run.slot
  slots: [morning, day, night]
  # slotStart after every advance where the clock stops; dayEnd before each
  # midnight; dayStart at the next morning
  raise: { slot: slotStart, dayStart: dayStart, dayEnd: dayEnd }
  week:
    length: 7
    first: 0
    labels: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]

entities:
  # ── the map (targets of enterTown / enterRoute / heal / shop) ──
  town:
    # (0.27) display labels: {{@town}} over a { domain: town } param and
    # {{occasion.target}} in a kind:town beat render these
    labels: { hollowtown: "Hollowtown", pebbleton: "Pebbleton", tidewell: "Tidewell", portvolt: "Portvolt", ashgrove: "Ashgrove", bloomfield: "Bloomfield", silvercrest: "Silvercrest", wardenmere: "Wardenmere", fairhaven: "Fairhaven", frostharbor: "Frostharbor", cinderisle: "Cinder Isle", verdantcity: "Verdant City" }
    members:
      - hollowtown     # south — home (spine)
      - pebbleton      # south — Stone Gym
      - tidewell       # south — Tide Gym
      - portvolt       # east  — Spark Gym, ferry harbor
      - ashgrove       # east  — Ash Tower
      - bloomfield     # east  — Bloom Gym
      - silvercrest    # mid   — Mind Gym, Game Corner, Helix Tower
      - wardenmere     # mid   — Venom Gym, Wildmoor Preserve
      - fairhaven      # mid   — day care, contest grounds
      - frostharbor    # north — sea town
      - cinderisle     # north — Blaze Gym
      - verdantcity    # north — Earth Gym
  route:
    members: [r1, r2, r3, r4, r5, r6, r7, r8, r9, r10, r11, r12, r13, r14, r15, r16]

  # ── gyms, league chambers (targets of challenge) ──
  arena:
    members: [stoneGym, tideGym, sparkGym, bloomGym, mindGym, venomGym, blazeGym, earthGym, frostChamber, fistChamber, shadeChamber, dragonChamber, championHall]

  # ── progress vocabulary ──
  badge:
    members: [stone, tide, spark, bloom, mind, venom, blaze, earth]
    labels: { stone: "Stone Badge", tide: "Tide Badge", spark: "Spark Badge", bloom: "Bloom Badge", mind: "Mind Badge", venom: "Venom Badge", blaze: "Blaze Badge", earth: "Earth Badge" }
  keyItem:
    labels: { monDex: "Monster Dex", hmFlash: "HM Flash", ferryTicket: "Ferry Ticket", hmCut: "HM Cut", wakingFlute: "Waking Flute", spectralLens: "Spectral Lens", cardKey: "Card Key", hmSurf: "HM Surf", goldTooth: "Gold Tooth", hmStrength: "HM Strength", hmFly: "HM Fly", volcanoKey: "Volcano Key" }
    members:
      - monDex        # spine: the professor
      - hmFlash       # south: the professor's aide (10 caught)
      - ferryTicket   # south: researcher Cassius at Tidewell Cape
      - hmCut         # east:  Captain Orla on the ferry
      - wakingFlute   # east:  Elder Rook, top of Ash Tower
      - spectralLens  # mid:   Game Corner lair
      - cardKey       # mid:   Helix Tower
      - hmSurf        # mid:   Wildmoor Preserve
      - goldTooth     # mid:   Wildmoor Preserve
      - hmStrength    # mid:   Warden Holt (for the gold tooth)
      - hmFly         # east:  Bloomfield
      - volcanoKey    # north: Cinder Mansion
  fieldMove: { members: [cut, flash, surf, strength, fly] }

  # the obstacles the engine will not let the player past until canPass
  gate:
    members:
      - pebbletonEast        # south: Stone Badge
      - ferryGangway         # east:  ferryTicket (from south)
      - portvoltTree         # east:  cut (hmCut east + Tide Badge south)
      - rockTunnel           # east:  flash (hmFlash south + Stone Badge south)
      - ashTowerStairs       # east:  spectralLens (from mid)
      - sleepingGiant        # mid:   wakingFlute (from east)
      - mindGymDoor          # mid:   Helix Tower cleared
      - seaRoute             # north: surf (hmSurf mid + Venom Badge mid)
      - cinderGymDoor        # north: volcanoKey
      - earthGymDoor         # north: the other seven badges
      - victoryRoadGate      # north: all eight badges
      - victoryRoadBoulders  # north: strength (hmStrength mid + Bloom Badge east)

  # ── Team Eclipse: the dig under Moonstone Cave (south), the siege of Ash
  #    Tower (east), the hideout under the Game Corner and the headquarters
  #    in Helix Tower (mid); Director Vex himself runs the Earth Gym (north) ──
  lair: { members: [quarryDig, towerSiege, cornerHideout, helixHQ] }
  # ── the six rival battles ──
  rivalMeet: { members: [lab, bridge, ferry, tower, road, champion] }
  # ── the Sunfall Isles (postgame, area isles): the ferry out of Frostharbor
  #    calls at each island (sail@isle.<island>); each has a beacon ──
  island:
    members: [emberkey, mistral, coralreach]
    labels: { emberkey: "Emberkey", mistral: "Mistral Isle", coralreach: "Coralreach" }

relations:
  # the starter: the player picks one, the rival takes the one that counters it
  chose:       { args: [starterMon], tier: run }
  rivalChose:  { args: [starterMon], derive: true, excludes: [chose] }

  # the dex and the party — the ENGINE writes these (catching, battles, PC)
  seen:        { args: [species], tier: run, reserved: true, changedOn: [battleEnd, caught] }
  caught:      { args: [species], tier: run, reserved: true, changedOn: [caught] }
  inParty:     { args: [species], tier: run, reserved: true, changedOn: [caught] }
  caughtType:  { args: [montype], derive: true }
  caughtLegend: { args: [legendary], derive: true }

  # progress — content writes these (the shared components do)
  hasBadge:    { args: [badge], tier: run }
  hasItem:     { args: [keyItem], tier: run }
  defeated:    { args: [trainer], tier: run }
  rivalFought: { args: [rivalMeet], tier: run }
  rivalBeaten: { args: [rivalMeet], tier: run }

  # what the progress unlocks — the engine reads these to open the map
  canUse:      { args: [fieldMove], derive: true }
  canPass:     { args: [gate], derive: true }
  beatElite:   { args: [elite], derive: true }

rules:
  - "rivalChose(S) :- chose(P), counters(S, P)"
  - "caughtType(T) :- caught(S), speciesType(S, T)"
  - "caughtLegend(S) :- caught(S), legendary(S)"
  - "beatElite(E) :- defeated(E), elite(E)"
  # field moves: the disc and the badge that lets it be used outside battle
  - "canUse(flash) :- hasItem(hmFlash), hasBadge(stone)"
  - "canUse(cut) :- hasItem(hmCut), hasBadge(tide)"
  - "canUse(fly) :- hasItem(hmFly), hasBadge(spark)"
  - "canUse(strength) :- hasItem(hmStrength), hasBadge(bloom)"
  - "canUse(surf) :- hasItem(hmSurf), hasBadge(venom)"
  # gates (the badge gates count badges: dsl 0.26.0 §6)
  - "canPass(pebbletonEast) :- hasBadge(stone)"
  - "canPass(ferryGangway) :- hasItem(ferryTicket)"
  - "canPass(portvoltTree) :- canUse(cut)"
  - "canPass(rockTunnel) :- canUse(flash)"
  - "canPass(ashTowerStairs) :- hasItem(spectralLens)"
  - "canPass(sleepingGiant) :- hasItem(wakingFlute)"
  - "canPass(mindGymDoor) :- cel(\"run.lair.helixHQ == 'cleared'\")"
  - "canPass(seaRoute) :- canUse(surf)"
  - "canPass(cinderGymDoor) :- hasItem(volcanoKey)"
  - "canPass(earthGymDoor) :- count(hasBadge(_)) >= 7"
  - "canPass(victoryRoadGate) :- count(hasBadge(_)) >= 8"
  - "canPass(victoryRoadBoulders) :- canUse(strength)"

defs:
  badgeCount:   "count('hasBadge', ['_'])"
  dexCaught:    "count('caught', ['_'])"
  dexSeen:      "count('seen', ['_'])"
  typesCaught:  "countDistinct('caughtType', ['_'], 0)"
  isMorning:    "run.slot == 'morning'"
  isNight:      "run.slot == 'night'"
  # the Wildmoor bug-catching contest: Tuesday, Thursday, Saturday (weekday 0 = Monday)
  contestDay:   "clock.weekday == 1 || clock.weekday == 3 || clock.weekday == 5"
  weekend:      "clock.weekday >= 5"
  # the outcome of the last ::battle{resultKey="fight"} in this scene
  wonFight:     { type: bool, cel: "scene.battle.fight.won" }
  champion:     "holds('rivalBeaten', ['champion'])"
