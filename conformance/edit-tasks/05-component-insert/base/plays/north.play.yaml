# AREA north: a full Highlands & Isles playthrough from a save that has just
# surfed out of the Midlands with six badges.
#
#   lute play . --script plays/north.play.yaml
#
# Clock: day 1 Monday morning. The play walks the week: day and night
# trainers, the Tuesday quiz, back to Maud with a fire monster, the Wednesday
# Earth Gym, and Friday's swimmer in the caverns; then both legends and
# Victory Road. OWNED BY north.
visited: [spine.lab, mid.helixTower]
presented: { run: [spine.broadcast] }
quests: { eclipseArc: active }
facts:
  - chose(dewpup)
  - caught(dewpup)
  - seen(dewpup)
  - inParty(dewpup)
  - hasItem(monDex)
  - hasItem(hmFlash)
  - hasItem(ferryTicket)
  - hasItem(hmCut)
  - hasItem(hmFly)
  - hasItem(spectralLens)
  - hasItem(wakingFlute)
  - hasItem(cardKey)
  - hasItem(hmSurf)
  - hasItem(goldTooth)
  - hasItem(hmStrength)
  - hasBadge(stone)
  - hasBadge(tide)
  - hasBadge(spark)
  - hasBadge(bloom)
  - hasBadge(mind)
  - hasBadge(venom)
  - rivalFought(lab)
  - rivalFought(bridge)
  - rivalFought(ferry)
  - rivalFought(tower)
state:
  run.lair.quarryDig: cleared
  run.lair.towerSiege: cleared
  run.lair.cornerHideout: cleared
  run.lair.helixHQ: cleared
choose:
  northMansionDoor: lab
  northQuizOne: water
  northQuizTwo: gym
  northQuizThree: eight
  northWrenStories: [ice, fire, leave]
steps:
  # ═══ Monday morning: the Strait and Frostharbor ═══════════════════════════
  - occasion: obstacle
    target: gate.seaRoute
    expect: { winner: none }
  - occasion: enterRoute
    target: route.r13
    expect: { winner: north.route13.enter }
  - occasion: trainerSpotted
    target: trainer.r13SwimmerLena
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.route13.r13SwimmerLena, state: { run.money: 4400 } }
  - occasion: trainerSpotted
    target: trainer.r13SwimmerTod
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.route13.r13SwimmerTod }
  - occasion: trainerSpotted
    target: trainer.r13FishermanWade
    label: Wade wins
    bridges: { battle: [ { won: false } ] }
    expect: { winner: north.route13.r13FishermanWade, notFacts: [defeated(r13FishermanWade)] }
  - occasion: trainerSpotted
    target: trainer.r13FishermanWade
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.route13.r13FishermanWade, facts: [defeated(r13FishermanWade)] }
  - occasion: trainerSpotted
    target: trainer.r13SailorBrig
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.route13.r13SailorBrig }
  - occasion: trainerSpotted
    target: trainer.r13BirdKeeperIsla
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.route13.r13BirdKeeperIsla }
  - occasion: trainerSpotted
    target: trainer.r13SwimmerNoor
    label: the night swimmer is not out by day
    expect: { winner: none }
  - occasion: talk
    target: npc.r13FishermanWade
    expect: { winner: northR13FishermanWadeAfter }
  - occasion: talk
    target: npc.r13Lifeguard
    expect: { winner: northBeaBark }
  - occasion: enterTown
    target: town.frostharbor
    expect: { winner: north.frostharbor.arrive }
  - occasion: enterTown
    target: town.frostharbor
    label: back into town, same morning
    expect: { winner: northFrostharborMorning }
  - occasion: heal
    target: town.frostharbor
    expect: { winner: north.frostharbor.center }
  - engine: { accept: [northFridaySwimmer] }
    label: the Center board (the engine accepts a board quest)
    expect: { quests: { northFridaySwimmer: active } }
  - occasion: shop
    target: town.frostharbor
    expect: { winner: north.frostharbor.mart }
  - occasion: talk
    target: npc.frostharborHarbormaster
    expect: { winner: northBrineMorning }
  - occasion: talk
    target: npc.frostharborNetmender
    expect: { winner: northIlseMorning }
  - occasion: talk
    target: npc.frostharborKid
    expect: { winner: northPipBark }
  - occasion: talk
    target: npc.frostharborCaveGuide
    expect: { winner: northHalvardBark }
  - occasion: talk
    target: npc.frostharborKeeper
    expect: { winner: north.frostharbor.maudAsk, quests: { northLighthouse: active } }
  - occasion: talk
    target: npc.frostharborKeeper
