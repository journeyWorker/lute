# Maud's keepsake beat comes from the `keepsake` beat template: it plays at
# bond 4, gives the kettle lid (the ::gift effect asserts gave/2) and the rule
# derives keepsakeFrom(maud).
file: ../lore/keepsakes.lute
beat: keepsakes.maud
state: { user.bond.maud: 4 }
expect:
  transcriptContains: ["Maud presses a chipped kettle lid into her hands", "Lid off my first kettle."]
  facts: ["gave(maud, kettleLid)", "keepsakeFrom(maud)"]
  notFacts: ["keepsakeFrom(oskar)"]
