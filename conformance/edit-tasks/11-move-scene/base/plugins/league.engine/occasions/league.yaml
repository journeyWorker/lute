# The moments the Monster League engine raises. Targets are closed domains
# over the world/roster kinds, so a typo'd target is E-BEAT-ATTR.
occasions:
  # a new save: the professor's welcome, then waking up at home
  newGame:        { select: sequence, description: "A new save starts (day 1, Monday morning)" }
  # the clock (world.schema.yaml clock.raise)
  slotStart:      { select: sequence, description: "A new time slot starts where an advance stops (run.day / run.slot already set)" }
  dayStart:       { select: sequence, description: "Midnight has passed: the first slot of the new day" }
  dayEnd:         { select: first, description: "The day closes (run.day not yet advanced)" }
  # the map
  enterTown:      { select: first, target: { prefix: town, entity: town }, description: "The player walks into a town (town.<town>)" }
  enterRoute:     { select: first, target: { prefix: route, entity: route }, description: "The player steps onto a route (route.<route>)" }
  enterPlace:     { select: first, target: { prefix: place, entity: place }, description: "The player enters a building, cave or dungeon (place.<place>)" }
  obstacle:       { select: first, target: { prefix: gate, entity: gate }, description: "The player bumps into a gate the map keeps shut until canPass(<gate>)" }
  # people
  talk:           { select: first, target: { prefix: npc, entity: person }, description: "The player presses A on someone (npc.<person>)" }
  trainerSpotted: { select: first, target: { prefix: trainer, entity: trainer }, description: "A trainer's line of sight catches the player (trainer.<trainer>)" }
  challenge:      { select: first, target: { prefix: arena, entity: arena }, description: "The player steps up to a gym leader, an Elite Four chamber or the champion (arena.<arena>)" }
  # services
  heal:           { select: first, target: { prefix: town, entity: town }, description: "The player talks to the nurse at a town's Monster Center" }
  shop:           { select: first, target: { prefix: town, entity: town }, description: "The player talks to the clerk at a town's Mart" }
  useItem:        { select: first, target: { prefix: item, entity: keyItem }, description: "The player uses a key item from the bag (item.<keyItem>)" }
  # the Sunfall Isles ferry (postgame): only the Champion may board
  sail:           { select: first, target: { prefix: isle, entity: island }, raisedWhen: "@champion", description: "The Isle Ferry docks at one of the Sunfall Isles (isle.<island>)" }
  # the battle system
  battleEnd:      { select: first, description: "Any battle has ended (after the scene that started it; wild battles too); seen() is updated" }
  caught:         { select: first, target: { prefix: mon, entity: species }, description: "A monster was caught; caught(), seen() and inParty() are already asserted (mon.<species>)" }
  blackout:       { select: first, description: "The whole party fainted; the engine has moved the player to the last Center and halved run.money" }
  # the ending: judge the quests first, so the epilogue reads how they ended
  hallOfFame:     { select: first, judge: before, description: "The champion is beaten and the Hall of Fame records the team" }
