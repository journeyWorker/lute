# AREA north: the sea routes, Frostharbor, Cinder Isle, Verdant City, Victory Road.
# OWNED BY north. Keep the last step's expect (the hand-off) green.
#
# Every step here is clock-independent: the areas before north may leave the
# clock anywhere, so this path uses only beats with no time guard (first
# visits, all-day trainers). The night trainers, the Friday swimmer and the
# legends are walked in plays/north.play.yaml.
steps:
  # ── the Strait (Route 13) and Frostharbor ────────────────────────────────
  - occasion: obstacle
    target: gate.seaRoute
    label: surf opens the Strait
    expect: { winner: none }
  - occasion: enterRoute
    target: route.r13
    expect: { winner: north.route13.enter }
  - occasion: trainerSpotted
    target: trainer.r13SwimmerLena
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.route13.r13SwimmerLena, facts: [defeated(r13SwimmerLena)] }
  - occasion: enterTown
    target: town.frostharbor
    expect: { winner: north.frostharbor.arrive }
  - occasion: talk
    target: npc.frostharborKeeper
    expect: { winner: north.frostharbor.maudAsk, quests: { northLighthouse: active } }
  - occasion: talk
    target: npc.frostharborKeeper
    label: the starter's flame lights the lamp
    expect: { winner: north.frostharbor.maudRelight, quests: { northLighthouse: complete } }

  # ── the Ember Channel (Route 14) and Cinder Isle ─────────────────────────
  - occasion: enterRoute
    target: route.r14
    expect: { winner: north.route14.enter }
  - occasion: trainerSpotted
    target: trainer.r14SailorJunn
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.route14.r14SailorJunn, facts: [defeated(r14SailorJunn)] }
  - occasion: enterTown
    target: town.cinderisle
    expect: { winner: north.cinderisle.arrive }
  - occasion: enterPlace
    target: place.cinderMansion
    choose: { northMansionDoor: library }
    expect: { winner: north.cinderMansion, facts: [canPass(cinderGymDoor)] }
  - occasion: trainerSpotted
    target: trainer.blazeGymSuperNerdQuill
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.blazeGymTrainers.blazeGymSuperNerdQuill }
  - occasion: challenge
    target: arena.blazeGym
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.blazeGym, facts: [canPass(earthGymDoor)] }

  # ── the Cliff Road (Route 15) and Verdant City ───────────────────────────
  - occasion: enterRoute
    target: route.r15
    expect: { winner: north.route15.enter }
  - occasion: trainerSpotted
    target: trainer.r15BikerJett
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.route15.r15BikerJett }
  - occasion: enterTown
    target: town.verdantcity
    label: Kai got here first
    expect: { winner: north.verdantcity.arrive }

  # ── the Earth Gym: Eclipse's last floor ──────────────────────────────────
  - occasion: trainerSpotted
    target: trainer.earthGymGruntHask
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.earthGymTrainers.earthGymGruntHask }
  - occasion: trainerSpotted
    target: trainer.earthGymAdminSelene
    label: Admin Selene, both teams
    bridges: { battle: [ { won: true }, { won: true } ] }
    expect: { winner: north.earthGymTrainers.earthGymAdminSelene, facts: [defeated(earthGymAdminSelene)] }
  - occasion: challenge
    target: arena.earthGym
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.earthGym, facts: [defeated(vex), hasBadge(earth)], quests: { badgeRoad: complete } }
  - occasion: battleEnd
    label: the Director steps down
    expect: { winner: spine.eclipseFalls, quests: { eclipseArc: complete } }

  # ── the League Road (Route 16) and Victory Road ──────────────────────────
  - occasion: enterRoute
    target: route.r16
    expect: { winner: north.route16.enter }
  - occasion: trainerSpotted
    target: trainer.r16CooltrainerAnya
    bridges: { battle: [ { won: true } ] }
    expect: { winner: north.route16.r16CooltrainerAnya }
  - occasion: enterPlace
    target: place.victoryRoad
    label: north hand-off
    bridges: { battle: [ { won: true } ] }
    expect:
      winner: north.victoryRoad
      facts: [rivalFought(road), canPass(victoryRoadGate), canPass(victoryRoadBoulders)]
      quests: { eclipseArc: complete, badgeRoad: complete }
