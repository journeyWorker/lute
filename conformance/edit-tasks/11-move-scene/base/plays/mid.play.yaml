# The Midlands on their own, over one week: Monday in Silvercrest and on the
# Mill Road (day and night), the Tuesday bug-catching contest, the Wednesday
# walk south (the giant, the ghosts, the day care), Helix Tower with Kai
# winning, Sabine winning once, and the Saturday sale.
#
#   lute play . --script plays/mid.play.yaml
#
# OWNED BY mid. Starts from a save that has what the south and east hand to
# mid's first visit; east's second visit (the flute, the siege lifted) is an
# engine step on Wednesday.
facts: [chose(cindle), hasItem(monDex), hasBadge(stone), hasBadge(tide), hasBadge(spark), hasBadge(bloom)]
choose:
  midOrielStories: [theater, well, lighthouse, leave]
  midContestEnter: enter
  midDayCareAsk: help
steps:
  - engine: { accept: [midNightPatrol] }
    label: the Silvercrest Center board (the engine accepts a board quest)
    expect: { quests: { midNightPatrol: active } }
  # ── Monday morning: Route 9 and Silvercrest ───────────────────────────
  - occasion: enterRoute
    target: route.r9
    expect: { winner: mid.route9.arrive }
  - occasion: trainerSpotted
    target: trainer.r9BirdKeeperOsric
    label: Osric flies his birds only in the morning
    bridges: { battle: [ { won: true } ] }
    expect: { winner: mid.route9.r9BirdKeeperOsric, facts: [defeated(r9BirdKeeperOsric)], state: { run.money: 3440 } }
  - occasion: talk
    target: npc.r9Signpost
    expect: { winner: midR9Sign }
  - occasion: enterTown
    target: town.silvercrest
    expect: { winner: mid.silvercrest.arrive }
  - occasion: shop
    target: town.silvercrest
    label: a weekday at the store
    expect: { winner: mid.silvercrest.mart }
  - occasion: talk
    target: npc.silvercrestMedium
    label: three stories, three child quests
    expect: { winner: mid.ghosts.oriel, options: { midOrielStories: [theater, well, lighthouse, leave] }, quests: { midGhostStories: active, midGhostTheater: active, midGhostWell: active, midGhostLighthouse: active } }
  - occasion: enterPlace
    target: place.silvercrestTheater
    label: no lens yet
    expect: { winner: midTheaterEmpty }
  - occasion: enterPlace
    target: place.gameCorner
    bridges: { battle: [ { won: true }, { won: true }, { won: true }, { won: true } ] }
    expect: { winner: mid.gameCorner, facts: [hasItem(spectralLens)], state: { run.lair.cornerHideout: cleared } }
  - occasion: enterPlace
    target: place.silvercrestTheater
    label: through the lens
    expect: { winner: mid.ghosts.theaterGhost, facts: [midGhostSeen(silvercrestTheater)], quests: { midGhostTheater: complete, midGhostStories: active } }
  - occasion: enterTown
    target: town.silvercrest
    expect: { winner: midSilvercrestMorning }
  - occasion: talk
    target: npc.silvercrestGambler
    expect: { winner: midGamblerAfter }

  # ── Monday afternoon and night: the Mill Road ─────────────────────────
  - advance: slot
  - occasion: enterRoute
    target: route.r10
    expect: { winner: mid.route10.arrive }
  - occasion: trainerSpotted
    target: trainer.r10CyclistRuna
    bridges: { battle: [ { won: true } ] }
    expect: { winner: mid.route10.r10CyclistRuna }
  - occasion: trainerSpotted
    target: trainer.r10BikerGrit
    label: the Riders are not out by day
    expect: { winner: none }
  - advance: slot
    label: nightfall
  - occasion: talk
    target: npc.r10Watchman
    expect: { winner: midR10WatchmanNight }
  - occasion: trainerSpotted
    target: trainer.r10BikerGrit
    bridges: { battle: [ { won: true } ] }
    expect: { winner: mid.route10.r10BikerGrit }
  - occasion: trainerSpotted
    target: trainer.r10BikerVanya
    bridges: { battle: [ { won: true } ] }
    expect: { winner: mid.route10.r10BikerVanya }
  - occasion: trainerSpotted
    target: trainer.r10RockerJolene
    label: the board's bounty
    bridges: { battle: [ { won: true } ] }
    expect: { winner: mid.route10.r10RockerJolene, quests: { midNightPatrol: complete } }
  - occasion: talk
    target: npc.r10Watchman
    expect: { winner: midR10WatchmanQuiet }
  - occasion: trainerSpotted
    target: trainer.r10CyclistRuna
    label: Runa has gone home
    expect: { winner: none }
  - occasion: enterTown
    target: town.wardenmere
    expect: { winner: mid.wardenmere.arrive }
  - occasion: enterPlace
    target: place.wardenmereWell
    label: the well sings, and the lens sees who
    expect: { winner: mid.ghosts.wellGhost, quests: { midGhostWell: complete } }

  # ── Tuesday: contest day ──────────────────────────────────────────────
  - advance: day
  - occasion: enterTown
    target: town.wardenmere
    label: the town heads for the Preserve
    expect: { winner: midWardenmereContestDay }
  - occasion: enterPlace
    target: place.wildmoorPreserve
    expect: { winner: mid.wildmoor, facts: [hasItem(hmSurf), hasItem(goldTooth)] }
  - occasion: talk
    target: npc.wildmoorContestOfficer
    label: entering the contest
    expect: { winner: mid.bugContest.register, options: { midContestEnter: [enter, decline] }, state: { run.midContest: entered, run.midContestScore: 0, run.midContestDay: 2 }, quests: { midContestChampion: active } }
  - occasion: talk
    target: npc.wildmoorContestOfficer
    expect: { winner: midContestDeskActive }
  - engine: { facts: [seen(inchlet), caught(inchlet), inParty(inchlet)] }
  - occasion: caught
    target: mon.inchlet
    expect: { winner: mid.bugContest.catchCommon, state: { run.midContestScore: 1 } }
  - engine: { facts: [seen(hornbeetle), caught(hornbeetle), inParty(hornbeetle)] }
  - occasion: caught
    target: mon.hornbeetle
    expect: { winner: mid.bugContest.catchRare, state: { run.midContestScore: 3 } }
  - engine: { facts: [seen(cocoonix), caught(cocoonix)] }
  - occasion: caught
    target: mon.cocoonix
    label: a lesser catch keeps the best
    expect: { winner: mid.bugContest.catchCommon, state: { run.midContestScore: 3 } }
  - advance: slot
    label: the bell
    expect: { state: { run.midContest: closed, run.midContestWins: 1 }, quests: { midContestChampion: complete } }
  - occasion: talk
    target: npc.wildmoorContestOfficer
    expect: { winner: midContestDeskDone }
  - engine: { facts: [seen(stingle), caught(stingle)] }
  - occasion: caught
    target: mon.stingle
    label: after the bell a catch is just a catch
    expect: { winner: none }
  - occasion: talk
    target: npc.wardenHolt
    expect: { winner: mid.wardenHolt, facts: [hasItem(hmStrength)], notFacts: [hasItem(goldTooth)] }
  - occasion: talk
    target: npc.wardenHolt
    expect: { winner: midHoltThanks }
  - occasion: trainerSpotted
    target: trainer.venomGymTamerOdile
    bridges: { battle: [ { won: false } ] }
    expect: { winner: mid.venomGymTrainers.venomGymTamerOdile, notFacts: [defeated(venomGymTamerOdile)] }
  - occasion: challenge
    target: arena.venomGym
    bridges: { battle: [ { won: true } ] }
    expect: { winner: mid.venomGym, facts: [hasBadge(venom), canUse(surf), canPass(seaRoute)] }

  # ── Wednesday: east has lifted the siege and handed over the flute ────
  - advance: day
    engine: { state: { run.lair.towerSiege: cleared }, facts: [hasItem(wakingFlute)] }
  - occasion: talk
    target: npc.wildmoorContestOfficer
    expect: { winner: midContestDeskOff }
  - occasion: useItem
    target: item.wakingFlute
    label: not here
    expect: { winner: midFluteElsewhere }
  - occasion: enterRoute
    target: route.r11
    expect: { winner: mid.route11.arrive }
  - occasion: talk
    target: npc.r11OldAngler
    expect: { winner: mid.route11.oldAnglerRod }
  - occasion: talk
    target: npc.r11OldAngler
    expect: { winner: midR11OldAnglerMorning }
  - occasion: enterTown
    target: town.fairhaven
    expect: { winner: mid.fairhaven.arrive }
  - occasion: talk
    target: npc.fairhavenDayCareMan
    expect: { winner: mid.fairhaven.tobbeAsks, quests: { midDayCareRunaway: active } }
  - occasion: talk
    target: npc.fairhavenDexRater
    expect: { winner: midDexRater }
  - occasion: enterRoute
    target: route.r12
    label: the flute wakes Slumbear
    expect: { winner: mid.giantWakes, quests: { midSleepingGiant: active } }
  - label: Slumbear is seen, not caught, and the battle ends
    engine: { facts: [seen(slumbear)] }
  - occasion: battleEnd
    expect: { quests: { midSleepingGiant: complete } }
  - occasion: talk
    target: npc.r12Hermit
    expect: { winner: midR12HermitAwake }
  - occasion: enterPlace
    target: place.fairhavenLighthouse
    label: the last ghost
    expect: { winner: mid.ghosts.lighthouseGhost, quests: { midGhostLighthouse: complete, midGhostStories: complete } }
  - engine: { facts: [seen(mothfuzz), caught(mothfuzz)] }
  - occasion: caught
    target: mon.mothfuzz
    expect: { winner: mid.catches.mothfuzz }
  - occasion: talk
    target: npc.fairhavenDayCareLady
    label: the runaway goes home
    expect: { winner: midIlseWaiting, quests: { midDayCareRunaway: complete } }

  # ── Helix Tower: Kai wins on eleven; Sabine wins once ─────────────────
  - occasion: enterPlace
    target: place.helixTower
    bridges: { battle: [ { won: true }, { won: true }, { won: true }, { won: true }, { won: false }, { won: true } ] }
    expect: { winner: mid.helixTower, facts: [rivalFought(tower), canPass(mindGymDoor)], notFacts: [rivalBeaten(tower)], state: { run.lair.helixHQ: cleared, run.rivalStanding: -1 } }
  - occasion: obstacle
    target: gate.mindGymDoor
    expect: { winner: none }
  - occasion: talk
    target: npc.mindGymGuide
    expect: { winner: midMindGymGuideOpen }
  - occasion: challenge
    target: arena.mindGym
    bridges: { battle: [ { won: false } ] }
    expect: { winner: mid.mindGym, notFacts: [hasBadge(mind)] }
  - occasion: challenge
    target: arena.mindGym
    bridges: { battle: [ { won: true } ] }
    expect: { winner: mid.mindGym, facts: [hasBadge(mind), defeated(sabine)] }
  - occasion: challenge
    target: arena.mindGym
    expect: { winner: none }

  # ── Saturday: the weekend sale, and a contest the player sits out ─────
  - advance: day
    repeat: 3
  - occasion: enterTown
    target: town.silvercrest
    expect: { winner: midSilvercrestWeekend }
  - occasion: shop
    target: town.silvercrest
    expect: { winner: mid.silvercrest.martSale }
  - occasion: enterPlace
    target: place.silvercrestDeptStore
    expect: { winner: mid.silvercrest.deptStoreSale }
  - occasion: talk
    target: npc.wildmoorContestOfficer
    choose: { midContestEnter: decline }
    expect: { winner: mid.bugContest.register, state: { run.midContest: closed } }
  - occasion: talk
    target: npc.silvercrestReceptionist
    expect: { winner: midReceptionistAfter }
expect:
  end: complete
  quests: { midNightPatrol: complete, midSleepingGiant: complete, midGhostStories: complete, midDayCareRunaway: complete, midContestChampion: complete }
  facts: [hasBadge(venom), hasBadge(mind), hasItem(hmSurf), hasItem(hmStrength), hasItem(spectralLens), hasItem(cardKey)]
  transcriptContains:
    - "@wildmoorContestOfficer: And first prize goes to... {{userName}}, for a truly magnificent bug! Please collect your Sun Stone at the desk!"
    - "Slumbear shakes itself, yawns so wide the reeds flatten"
    - "@rival: Ha! I'll handle the top floor myself, then. Try to keep up."
  transcriptLacks: ["The ball rocks once, twice, three times"]
