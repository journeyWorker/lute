# Wren's route, from a Saturday save: every lantern part found, the forecast
# delivered, Sol's Perseids missed.
#   lute play . --script plays/wren-weekend.play.yaml
visited: [wren.first, sol.first, ines.forecast, village.deliver]
presented: { run: [days.arrival, wren.first, sol.first, ines.forecast, village.deliver] }
quests: { forecast: complete, lantern: active, meteor: failed, logkeeper: complete }
state:
  run.day: 6
  run.slot: afternoon
  run.aff.wren: 2
  run.aff.sol: 1
  run.readings: 5
  run.forecastWritten: true
  run.forecastDelivered: true
facts: ["carrying(paper)", "carrying(wire)", "carrying(candle)"]
choose:
  wrenAnswer: hold
steps:
  - occasion: slotStart
    expect: { clock: { weekday: Saturday, slot: afternoon } }
  - occasion: visit
    target: place.village
    expect: { presented: [talks.wrenLantern, talks.wrenWarm], quests: { lantern: complete }, state: { run.aff.wren: 3 } }
  - advance: { to: night }
  - label: Saturday night, the deck
    occasion: visit
    target: place.deck
    expect: { winner: wren.confession, state: { run.route: wren } }
  - label: then the roof — Sol has nothing to confess to a taken heart
    occasion: visit
    target: place.roof
    expect: { winner: talks.solRoofIdle, notOffered: [sol.confession] }
  - advance: { to: { weekday: Sunday, slot: afternoon } }
  - occasion: visit
    target: place.deck
    expect: { winner: wren.sunday }
  - advance: { to: night }
    expect: { presented: [festival.night] }
expect:
  end: terminal
  state: { run.route: wren, user.summers: 1 }
  transcriptContains:
    - "Stay till the last one's gone? That's the rule. I just made it the rule."
    - "rises straight up, very steady, like it knows the way."
  transcriptLacks:
    - "I came down the mountain."
