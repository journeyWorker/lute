# Monday to Wednesday night, the attentive way: meet Sol and Wren on Monday,
# promise the Perseids, gather paper (Tue) and wire (Wed, in the storm), write
# the forecast. Shared by every route that diverges on Thursday: it starts on
# Monday morning and hands off on Wednesday night (both asserted).
# Choices it needs from the including play: village, care, solHello,
# lanternAsk, perseids, post, call.
steps:
  # ── Monday ─────────────────────────────────────────────
  # The engine's run-start raise (the clock's `raiseAtStart: true`).
  - occasion: slotStart
    expect: { clock: { day: 1, weekday: Monday, slot: morning }, presented: [days.arrival, routine.morning], quests: { forecast: active } }
  - occasion: visit
    target: place.radio
    expect: { winner: sol.first }
  - advance: { to: afternoon }
  - occasion: visit
    target: place.village
    expect: { winner: wren.first, quests: { lantern: active } }
  - advance: { to: night }
  - occasion: visit
    target: place.roof
    expect: { winner: sol.roof, quests: { meteor: active } }
  # ── Tuesday (post day) ─────────────────────────────────
  - advance: { to: { weekday: Tuesday, slot: morning } }
    expect: { presented: [routine.dayClose, routine.morning, days.postHorn] }
  - occasion: visit
    target: place.kitchen
    expect: { winner: talks.pellPost, facts: ["carrying(paper)"] }
  - advance: { to: afternoon }
  - occasion: visit
    target: place.radio
    expect: { winner: ines.forecast, state: { run.forecastWritten: true } }
  - advance: { to: night }
  - occasion: visit
    target: place.roof
    expect: { winner: talks.solRoofIdle }
  # ── Wednesday: the storm ───────────────────────────────
  - label: the engine rolls a storm overnight
    engine:
      state: { run.weather: storm }
      facts: ["pathShut(village)"]
  - advance: { to: { weekday: Wednesday, slot: morning } }
    expect: { presented: [routine.dayClose, days.storm, routine.morning], quests: { battenDown: active } }
  - occasion: visit
    target: place.radio
    choose: { radioHub: [listen, wire, leave] }
    expect: { winner: talks.solRadio, facts: ["carrying(wire)"] }
  - label: reading the logbook while the storm blows
    occasion: logbook
    pick: log1994
    expect: { offered: [logStorm, log1971, log1994], notOffered: [log1998] }
  - advance: { to: afternoon }
  - occasion: visit
    target: place.village
    expect: { winner: villageShut }
  - advance: { to: night }
  - label: storm watch, the roof
    occasion: visit
    target: place.roof
    expect: { winner: storm.mast }
  - occasion: visit
    target: place.kitchen
    expect: { winner: storm.shutters, quests: { battenDown: complete } }
  - label: the roof again; the mast is lashed, the hatch stays shut
    occasion: visit
    target: place.roof
    expect: { winner: roofEmpty }
  - label: the storm blows over in the night
    engine:
      state: { run.weather: clear }
      retract: ["pathShut(village)"]
    expect: { clock: { weekday: Wednesday, slot: night } }
