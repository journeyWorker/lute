# OWNED BY AREA south: area-private state, enums, relations, defs.
# Every name declared here starts with the area: run.southX, user.southX,
# enum/kind/relation/def southX. Other areas never read it; anything another
# area needs goes into the world contract (ask the lead).
state:
  # the fossil the player carried out of the Moonstone dig; the Pebbleton
  # museum's lab revives it (::gift)
  run.southFossil: { type: { enum: [none, dome, spiral] }, default: none }

defs:
  # the Tidewell fishing derby: Sundays (weekday 0 = Monday)
  southDerbyDay: "clock.weekday == 6"
  # the recruiter at the end of the Tidewell bridge has made his pitch
  southRecruiterMet: { type: bool, cel: "visited('south.route4.r4GruntRecruiter')" }
  # the three grunts who guard the dig are down: the pit is open
  southDigOpen: "holds('defeated', ['moonstoneGruntSable']) && holds('defeated', ['moonstoneGruntFlint']) && holds('defeated', ['moonstoneGruntMarl'])"

