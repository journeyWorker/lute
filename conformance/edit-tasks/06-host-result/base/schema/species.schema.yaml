  # the three the professor offers in the lab (spine)
  starterMon: { subsetOf: species, members: [sproutle, cindle, dewpup] }
  # one-of-a-kind encounters: never on a route table (areas: scripted only)
  legendary: { subsetOf: species, members: [frostwing, thunderwing, blazewing, aethon, mythling] }

relations:
  # static data, the same in every save
  speciesType: { args: [species, montype], tier: app }
  # the starter triangle: counters(A, B) = A is strong against B
  counters:    { args: [starterMon, starterMon], tier: app }

