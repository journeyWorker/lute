# Monster League — the species roster and its types.
#
# LEAD-OWNED (world contract). Area writers read these ids; they never add,
# rename or retype a species. The ENGINE owns stats, moves, levels,
# evolution and encounter tables: this file only names what content can
# talk about (`caught(S)`, `seen(S)`, `mon.<species>` targets).
#
# Numbering follows the regional dex order (#001 … #151).

entities:
