# AREA isles: the Sunfall Isles postgame, from a save that has just beaten
# the Champion. Clock: day 1 Monday morning (the save's), through the three
# beacons and Admin Nyx on Monday, the island radio on Tuesday, the Battle
# Tower on Saturday, and the tower's new week on Monday.
#
#   lute play . --script plays/isles.play.yaml
visited: [spine.lab, spine.champion, spine.hallOfFame]
quests: { league: complete, legacy: active }
facts:
  - chose(cindle)
  - caught(cindle)
  - seen(cindle)
  - inParty(cindle)
  - hasItem(monDex)
  - rivalFought(champion)
  - rivalBeaten(champion)
state:
  user.hallOfFame: 1
choose:
  islesArrivalAsk: help
  # the windmill: one turn per visit; the second visit turns one the wrong way
  islesVane: [west, east, west, west]
steps:
  # ── Monday: Sunport ───────────────────────────────────────────────────────
  - occasion: enterTown
    target: town.sunport
    label: off the Isle Ferry
    expect:
      winner: isles.arrival
      quests: { islesBeacons: active, islesEmberkey: active, islesMistral: active, islesCoralreach: active, islesTowerWeek: active }
  - occasion: talk
    target: npc.sunportTowerClerk
    expect: { winner: isles.sunport.towerRules }
  - occasion: talk
    target: npc.sunportTowerClerk
    expect: { winner: islesTowerClerkBark }

  # ── Emberkey ──────────────────────────────────────────────────────────────
  - occasion: sail
    target: isle.emberkey
    expect: { winner: isles.islands.sailFirstEmberkey }
  - occasion: enterPlace
    target: place.emberkeyBeacon
    bridges: { battle: [ { won: true } ] }
    expect: { winner: isles.emberkeyBeacon, facts: [islesLensBack(emberkey), defeated(duskGruntCinder)] }
  - occasion: talk
    target: npc.emberkeyKeeper
    expect: { winner: isles.islands.brandRelight, facts: [islesRelit(emberkey)], quests: { islesEmberkey: complete } }
  - occasion: sail
    target: isle.emberkey
    label: the ferry calls again
    expect: { winner: islesSailAgain }

  # ── Mistral ───────────────────────────────────────────────────────────────
  - occasion: sail
    target: isle.mistral
    expect: { winner: isles.islands.sailFirstMistral }
  - occasion: enterPlace
    target: place.mistralWindmill
    label: the windmill, three turns right and one wrong
    expect: { winner: isles.islands.windmill, state: { run.islesVanes: 1 } }
  - occasion: enterPlace
    target: place.mistralWindmill
    expect: { winner: isles.islands.windmill, state: { run.islesVanes: 1 } }
  - occasion: enterPlace
    target: place.mistralWindmill
    expect: { winner: isles.islands.windmill, state: { run.islesVanes: 2 } }
  - occasion: enterPlace
    target: place.mistralWindmill
    expect: { winner: isles.islands.windmill, state: { run.islesVanes: 3 } }
  - occasion: enterPlace
    target: place.mistralWindmill
    label: the sails face the wind; the loft opens
    bridges: { battle: [ { won: true } ] }
    expect: { winner: isles.mistralLoft, facts: [islesLensBack(mistral)] }
  - occasion: talk
    target: npc.mistralKeeper
    expect: { winner: isles.islands.sorrelRelight, quests: { islesMistral: complete } }

  # ── Coralreach, with the board's courier job ──────────────────────────────
  - label: the player takes the courier notice at the Sunport board
    engine: { accept: [islesCourier] }
    expect: { quests: { islesCourier: active } }
  - occasion: sail
    target: isle.coralreach
    expect: { winner: isles.islands.sailFirstCoralreach }
  - occasion: trainerSpotted
    target: trainer.coralreachSwimmerTess
    bridges: { battle: [ { won: true } ] }
    expect: { winner: isles.trainers.coralreachSwimmerTess, facts: [defeated(coralreachSwimmerTess)] }
  - occasion: enterPlace
    target: place.coralCave
    label: low tide
    bridges: { battle: [ { won: true } ] }
    expect: { winner: isles.coralCave, facts: [islesLensBack(coralreach)] }
  - occasion: talk
    target: npc.coralreachKeeper
    expect:
      winner: isles.islands.nerissaRelight
      facts: [islesRelit(coralreach), canPass(islesShrineDoor)]
      quests: { islesCoralreach: complete, islesCourier: complete }

  # ── Monday night: the shrine ──────────────────────────────────────────────
  - advance: { to: night }
  - occasion: enterTown
    target: town.sunport
    expect: { winner: islesSunportNight }
  - occasion: enterPlace
    target: place.sunfallShrine
    expect: { winner: isles.shrine }
  - occasion: enterPlace
    target: place.sunfallShrine
    label: Nyx wins the first round
    bridges: { battle: [ { won: false } ] }
    expect: { winner: isles.shrineNyx, notFacts: [defeated(duskAdminNyx)], quests: { islesBeacons: active } }
  - occasion: enterPlace
    target: place.sunfallShrine
    bridges: { battle: [ { won: true } ] }
    expect: { winner: isles.shrineNyx, facts: [defeated(duskAdminNyx)], quests: { islesBeacons: complete } }

  # ── Tuesday morning: the island report ────────────────────────────────────
  - advance: day
    label: the radio reads out every beacon
    expect: { clock: { weekday: Tuesday, slot: morning } }
  - occasion: talk
    target: npc.duskGruntCinder
    expect: { winner: isles.sunport.duskBeaten }

  # ── Saturday: the Battle Tower ────────────────────────────────────────────
  - advance: { to: { weekday: Saturday, slot: day } }
  - occasion: challenge
    target: arena.sunportTower
    bridges: { battle: [ { won: true } ] }
    expect: { winner: isles.tower, state: { run.islesTowerStreak: 1 } }
  - occasion: challenge
    target: arena.sunportTower
    label: the streak breaks
    bridges: { battle: [ { won: false } ] }
    expect: { state: { run.islesTowerStreak: 0 } }
  - occasion: challenge
    target: arena.sunportTower
    bridges: { battle: [ { won: true } ] }
    repeat: 2
  - occasion: challenge
    target: arena.sunportTower
    label: three in a row
    bridges: { battle: [ { won: true } ] }
    expect: { state: { run.islesTowerStreak: 3 }, quests: { islesTowerWeek: complete } }

  # ── the next Monday: a new week at the tower ──────────────────────────────
  - label: the engine resets the tower streak for the new week
    engine: { state: { run.islesTowerStreak: 0 } }
  - advance: { to: { weekday: Monday, slot: morning } }
    expect: { quests: { islesTowerWeek: active } }
  - occasion: talk
    target: npc.sunportTowerClerk
    expect: { winner: isles.sunport.towerRules }
expect:
  quests: { islesBeacons: complete, islesCourier: complete, islesTowerWeek: active }
  transcriptContains:
    - "@narrator: One beacon burns over the Sunfall Isles."
    - "@narrator: 3 beacons burn over the Sunfall Isles."
    - "@announcer: The Emberkey beacon burned all night."
    - "@announcer: The Mistral Isle beacon burned all night."
    - "@announcer: The Coralreach beacon burned all night."
    - "@narrator: The Isle Ferry noses in to Emberkey."
    - "@narrator: Light pours out of the Coralreach beacon and runs across the water."
