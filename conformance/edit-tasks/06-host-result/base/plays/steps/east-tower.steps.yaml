# AREA east, second visit: back from Silvercrest with mid's spectralLens,
# Ash Tower by night. OWNED BY east. Keep the last step's expect (the
# hand-off) green.
#
# Clock: whatever the areas before leave it at; the first step goes on to
# the next night (Ash Tower by night) and says where that is.
steps:
  - advance: { to: night }
    label: Ash Tower at night
    expect: { clock: { weekday: Tuesday, slot: night } }
  - occasion: enterTown
    target: town.ashgrove
    expect: { winner: eastAshgroveNight }
  - occasion: enterPlace
    target: place.ashTowerHall
    label: the lens shows what stands on the stairs
    expect: { winner: east.ashTowerLens, notOffered: [east.lanternNight] }
  - occasion: obstacle
    target: gate.ashTowerStairs
    expect: { winner: none }
  - occasion: trainerSpotted
    target: trainer.ashTowerMediumAgatha
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersAshTower.ashTowerMediumAgatha }
  - occasion: trainerSpotted
    target: trainer.ashTowerGruntMoss
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersAshTower.ashTowerGruntMoss }
  - occasion: trainerSpotted
    target: trainer.ashTowerAdminCorvid
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersAshTower.ashTowerAdminCorvid, facts: [defeated(ashTowerAdminCorvid)], state: { run.lair.towerSiege: found } }
  - occasion: enterPlace
    target: place.ashTower
    label: east hand-off (second visit)
    bridges: { battle: [ { won: true } ] }
    expect:
      winner: east.ashTower
      facts: [hasItem(wakingFlute), canPass(sleepingGiant)]
      state: { run.lair.towerSiege: cleared }
