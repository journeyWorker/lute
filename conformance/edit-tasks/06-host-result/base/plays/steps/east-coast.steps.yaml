# AREA east, first visit: the Meridian, Portvolt, Route 5, the Lantern Tunnel,
# Ashgrove (the tower is besieged; its stairs need mid's lens), Route 6,
# Bloomfield. OWNED BY east. Keep the last step's expect (the hand-off) green.
#
# Clock: the spine arrives here on day 2 (Tuesday) morning (the first step
# says so), and this file never advances it. Tuesday morning means: no
# Wednesday market, no Friday lanterns, and the night-only trainers
# (Picnicker June) are not out.
steps:
  - occasion: obstacle
    target: gate.ferryGangway
    label: the ticket from south opens the gangway
    expect: { winner: none, clock: { weekday: Tuesday, slot: morning } }
  - occasion: enterPlace
    target: place.ferryMeridian
    label: Kai wins this one
    bridges: { battle: [ { won: false } ] }
    expect: { winner: east.ferryRival, facts: [rivalFought(ferry)], notFacts: [rivalBeaten(ferry)], state: { run.rivalStanding: 1 }, quests: { eastMeridianPassengers: active } }
  - occasion: trainerSpotted
    target: trainer.meridianSailorBram
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersMeridian.meridianSailorBram, facts: [defeated(meridianSailorBram)] }
  - occasion: trainerSpotted
    target: trainer.meridianBeautyCeline
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersMeridian.meridianBeautyCeline }
  - occasion: talk
    target: npc.meridianBeautyCeline
    expect: { winner: eastMeridianBeautyCelineAfter }
  - occasion: talk
    target: npc.captainOrla
    choose: { eastOrlaHelp: water }
    expect: { winner: east.captainOrla, facts: [hasItem(hmCut), canUse(cut), canPass(portvoltTree)] }
  - occasion: talk
    target: npc.captainOrla
    expect: { winner: eastOrlaAfter }

  # ── Portvolt ──
  - occasion: enterTown
    target: town.portvolt
    expect: { winner: east.portvoltArrival, notOffered: [east.portvoltMarket] }
  - occasion: obstacle
    target: gate.portvoltTree
    label: Cut and the Tide Badge clear the council's tree
    expect: { winner: none }
  - occasion: heal
    target: town.portvolt
    expect: { winner: east.portvolt.center }
  - occasion: talk
    target: npc.portvoltFisher
    expect: { winner: east.portvolt.nedRod }
  - occasion: talk
    target: npc.portvoltGymGuide
    expect: { winner: eastPortvoltGuideBefore }
  - occasion: trainerSpotted
    target: trainer.sparkGymEngineerWatts
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersGyms.sparkGymEngineerWatts }
  - occasion: trainerSpotted
    target: trainer.sparkGymRockerJolt
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersGyms.sparkGymRockerJolt }
  - occasion: challenge
    target: arena.sparkGym
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.sparkGym, facts: [hasBadge(spark), defeated(volta)] }

  # ── Route 5 and the Lantern Tunnel ──
  - occasion: enterRoute
    target: route.r5
    expect: { winner: east.routes.r5First }
  - occasion: trainerSpotted
    target: trainer.r5LassDaisy
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersRoutes.r5LassDaisy }
  - occasion: trainerSpotted
    target: trainer.r5PicnickerJune
    label: June only comes out at night
    expect: { winner: none }
  - occasion: obstacle
    target: gate.rockTunnel
    label: Flash (south) lights the tunnel
    expect: { winner: none }
  - occasion: enterPlace
    target: place.lanternTunnel
    expect: { winner: east.lanternTunnel }
  - occasion: trainerSpotted
    target: trainer.lanternTunnelHikerBess
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersRoutes.lanternTunnelHikerBess }

  # ── Ashgrove: the besieged tower ──
  - occasion: enterTown
    target: town.ashgrove
    expect: { winner: east.ashgroveArrival }
  - occasion: talk
    target: npc.ashgroveLanternMaker
    expect: { winner: east.ashgrove.yunLanterns, quests: { eastLanterns: active } }
  - occasion: enterPlace
    target: place.ashTowerHall
    expect: { winner: east.ashTowerHall, state: { run.lair.towerSiege: found } }
  - occasion: obstacle
    target: gate.ashTowerStairs
    label: Ash Tower needs mid's lens
    expect: { winner: eastGateAshTowerStairs }

  # ── Route 6 and Bloomfield ──
  - occasion: enterRoute
    target: route.r6
    expect: { winner: east.routes.r6First }
  - occasion: trainerSpotted
    target: trainer.r6BirdKeeperWren
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersRoutes.r6BirdKeeperWren }
  - occasion: enterTown
    target: town.bloomfield
    expect: { winner: east.bloomfieldArrival }
  - occasion: talk
    target: npc.bloomfieldFlorist
    expect: { winner: east.bloomfield.poppyGardens, quests: { eastGardens: active, eastGardensSeeds: active, eastGardensBees: unset } }
  - occasion: trainerSpotted
    target: trainer.bloomGymLassRose
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersGyms.bloomGymLassRose }
  - occasion: trainerSpotted
    target: trainer.bloomGymBeautyLily
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersGyms.bloomGymBeautyLily }
  - occasion: trainerSpotted
    target: trainer.bloomGymPicnickerIvy
    bridges: { battle: [ { won: true } ] }
    expect: { winner: east.trainersGyms.bloomGymPicnickerIvy }
  - occasion: challenge
    target: arena.bloomGym
    label: east hand-off (first visit)
    bridges: { battle: [ { won: true } ] }
    expect:
      winner: east.bloomGym
      facts: [hasBadge(spark), hasBadge(bloom), hasItem(hmCut), hasItem(hmFly), canUse(fly), rivalFought(ferry)]
      clock: { weekday: Tuesday, slot: morning }
