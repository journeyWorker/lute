# ::battle{foe="petra" kind="gym" resultKey="fight"} — a blocking bridge: the
# engine fights the battle and writes scene.battle.<resultKey>.* before the
# next line runs. The shared components always use resultKey="fight"
# (declared in world.schema.yaml; read it through @wonFight).
directives:
  - name: battle
    layer: bridge
    attrs:
      - { name: foe,       required: true, type: string }
      - { name: kind,      required: true, type: { enum: [trainer, gym, rival, elite, champion, boss] } }
      - { name: team,      type: string }
      - { name: resultKey, required: true, type: { slotId: { namespace: scene.battle } } }
      - { name: sync,      type: bool, default: true }
    semantics: [ "writes.sceneState", "bridgeCall" ]
    state:
      declares:
        - { scope: scene, path: [battle, { fromAttr: { name: resultKey, slotType: localId } }], shape: battleResult }
    effects:
      writes:
        - { scope: scene, path: [battle, { fromAttr: { name: resultKey } }, won],     value: { fromBridgeResult: won } }
        - { scope: scene, path: [battle, { fromAttr: { name: resultKey } }, prize],   value: { fromBridgeResult: prize } }
        - { scope: scene, path: [battle, { fromAttr: { name: resultKey } }, turns],   value: { fromBridgeResult: turns } }
        - { scope: scene, path: [battle, { fromAttr: { name: resultKey } }, fainted], value: { fromBridgeResult: fainted } }
    bridge: { service: battle, operation: fight }
