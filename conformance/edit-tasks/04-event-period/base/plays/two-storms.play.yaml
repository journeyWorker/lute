# Two storms in one week. Each storm is a fresh storm watch (`seasons: storm`):
# the chores and the batten-down quest come back, and the second storm
# remembers the first (`prev.season.storm.*`).
#   lute play . --script plays/two-storms.play.yaml
visited: [days.arrival, sol.first, wren.first]
presented: { run: [days.arrival, sol.first, wren.first] }
state: { run.day: 3, run.slot: morning }
choose: { care: careful }
steps:
  - label: the first storm rolls in
    engine: { state: { run.weather: storm }, facts: ["pathShut(village)"] }
    expect: { quests: { battenDown: active } }
  - advance: { to: night }
  - occasion: visit
    target: place.roof
    expect: { winner: storm.mast }
  - occasion: visit
    target: place.kitchen
    expect: { winner: storm.shutters, quests: { battenDown: complete } }
  - label: Ines writes it up
    occasion: logbook
    pick: logBatten
  - label: it blows over
    engine: { state: { run.weather: clear }, retract: ["pathShut(village)"] }
  - label: the second storm, Friday
    advance: { to: { weekday: Friday, slot: morning } }
    engine: { state: { run.weather: storm }, facts: ["pathShut(village)"] }
    expect: { presented: [routine.dayClose, routine.dayClose, days.storm, routine.morning], quests: { battenDown: active }, state: { season.storm.mast: false } }
  - advance: { to: night }
  - occasion: visit
    target: place.roof
    expect: { winner: storm.mast, state: { season.storm.mast: true } }
expect:
  transcriptContains:
    - "You tie the same bowline you tied last storm. Your hands remember before you do."
    - "intern did both without being asked."
