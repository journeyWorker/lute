# still gives the Dex and moves the standing down.
file: ../../scenes/spine/lab.lute
choose: { starter: sproutle }
bridges: { battle: [ { won: false } ] }
visited: [spine.home]
expect:
  options: { starter: [sproutle, cindle, dewpup] }
  accepts: [dexProject]
  facts: [chose(sproutle), rivalChose(cindle), hasItem(monDex), rivalFought(lab)]
  notFacts: [rivalChose(sproutle), rivalBeaten(lab)]
