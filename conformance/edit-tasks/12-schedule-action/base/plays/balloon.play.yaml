# The radiosonde is a retry, not a one-off: the scene comes back every
# afternoon until the balloon is up (`spentBy: run.balloonUp`).
#   lute play . --script plays/balloon.play.yaml
visited: [days.arrival, sol.first, wren.first, ines.forecast]
presented: { run: [days.arrival, sol.first, wren.first, ines.forecast] }
quests: { forecast: active }
state: { run.day: 2, run.slot: afternoon, run.weather: fog, run.forecastWritten: true, run.readings: 2 }
steps:
  - label: fog; let it go anyway
    occasion: visit
    target: place.deck
    choose: { launch: now }
    expect: { winner: ines.balloon, state: { run.balloonUp: false, run.balloonTries: 1 } }
  - label: still fog; wait for a lull
    occasion: visit
    target: place.deck
    choose: { launch: wait }
    expect: { winner: ines.balloon, state: { run.balloonTries: 2 } }
  - label: the fog lifts overnight
    engine: { state: { run.weather: clear } }
  - advance: { to: { weekday: Wednesday, slot: afternoon } }
  - occasion: visit
    target: place.deck
    choose: { launch: now }
    expect: { winner: ines.balloon, state: { run.balloonUp: true } }
  - label: the scene is spent now the balloon is up
    occasion: visit
    target: place.deck
    expect: { winner: deckEmpty, notOffered: [ines.balloon] }
expect:
  transcriptContains:
    - "@ines: 2 balloons in the bin already. The Met Office bills us for them."
    - "The pop is almost polite."
