# State + relational world for the lore-entry conformance fixtures (dsl 0.19.0).
# `knows` is the relation a first read reveals; `run.labBurned` selects the
# entry body's `<match>` arm; `run.logsRead` counts first reads.
entities:
  crew:  { members: [vesna, scientist] }
  topic: { members: [project_lumen] }

relations:
  knows: { args: [crew, topic], tier: run }

state:
  run.labBurned: { type: bool, default: false }
  run.logsRead:  { type: number, default: 0 }
