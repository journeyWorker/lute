# docs/examples/lute.project.yaml
# Root project so opening any loose example resolves core-only capabilities.
# Examples needing plugins live under their own subprojects (arcia-project/,
# plugindef-project/, showcase/) and are checked with --project <subproject>.
defaultProfile: core
profiles:
  core:
    plugins: {}

# Identity templates (dsl §10). `{prefix}.{speaker}-{code}` is the default
# voiceKey since dsl 0.22.0 (pinned here for older toolchains): without the scene
# prefix, two documents' lines with the same speaker and code would share one
# voice asset (E-DUP-VOICEKEY).
identity:
  voiceKey: "{prefix}.{speaker}-{code}"
