# The Task 4 quest — the one deliberately left without an `after=` (see the T4
# controller decision). That omission is invisible from here: `lute test` traces a
# quest document identically whether or not it is a node in the scenario graph, so
# the test suite cannot tell you the thing `lute scenario` can.
#
# With this file the suite covers 17 of the project's 18 documents. The eighteenth
# is `components/purser-interject.component.lute`, which no test can name: a
# component is not a root document — its `params:` are bound at each `::use` — so
# it has no standalone trace to assert against. `lute trace` says exactly that and
# points at an importing document; `lute check` on the file reports the
# component's own verdict. The two no longer contradict each other (0.10.0 §9).
file: ../quests/hold-the-spine.lute
state:
  run.shedPressure: 2
facts:
  - "awake(toma)"
  - "knows(toma, shed_sequence)"
  - "can_halt(toma)"
expect:
  exit: complete
  transcriptContains:
    - "The shed halted, one module short of the infirmary."
  state:
    run.vesnaTrust: 1
