# Ember Road — chapter two of the caravan saga.
# The world schema every document imports through the manifest's `defaults: uses:`.

state:
  # --- the road: the engine moves the caravan, content only reads where it is ---
  # 1 the Ostwick road · 2 Harrow's Ford · 3 the Tollbridge · 4 the far bank
  run.leg: { type: int, default: 1, owner: engine }
  # nights on the road; the engine advances it when the party breaks camp
  run.night: { type: int, default: 1, owner: engine }

  # --- the battle at the Tollbridge: the ENGINE fights it and writes the result ---
  # unset until a battle has been fought
  run.battle.outcome: { type: { enum: [won, lost] }, owner: engine }

  # --- companion approval (run tier: a new playthrough starts cold) ---
  # one number per companion: run.approval.isolde, .corvin, .wren (dsl 0.24 §3)
  run.approval: { type: int, default: 0, per: companion }

  # --- faction reputation: one number per faction ---
  run.rep: { type: int, default: { _: 0, company: 1, dusk: -1 }, per: faction }

  # --- how the party chose to open the bridge ---
  run.bridge: { type: { enum: [held, parleyed, paid, sold, stormed] }, default: held }
  run.hostagesFreed: { type: bool, default: false }
  run.tollRefused: { type: bool, default: false }
  run.maelisGrievance: { type: bool, default: false }

  # --- purse: GOLD rewards credit it ---
  run.gold: { type: int, default: 40 }
  # --- the caravan: a battle can burn wagons (the engine says how many) ---
  run.wagons: { type: int, default: 11 }

  # --- across playthroughs ---
  user.xp: { type: int, default: 0 }
  user.chaptersCleared: { type: int, default: 0 }

# nights on the road as a declared, day-granular clock (dsl 0.24 §1). One
# `advance: day` is one night: the party makes camp (dayEnd), the night passes,
# and the caravan moves on (the day's one slot raises travel).
clock:
  day: run.night
  raise: { dayEnd: camp, slot: travel }
  # the Company's contract runs out on the fourth night (dsl 0.27 §4)
  days: 4

# the caravan is gone: nothing more happens on this road (dsl 0.27 §4)
terminal: "run.wagons <= 0"

entities:
  # everyone the player can talk to (the `talk` occasion's target domain);
  # the companions are people too, through `subsetOf` (dsl 0.26 §2.3)
  person:    { members: [oda, maelis, brannoc] }
  # the people who can travel with the Warden
  companion: { subsetOf: person, members: [isolde, corvin, wren] }
  faction:
    members: [company, marrow, dusk]
    labels: { company: the Ashen Company, marrow: the Marrow folk, dusk: the Duskbound }
  # what the party can learn: the Company's burn ledger, Wren's brother's
  # token, the smugglers' passage under the mill, Coldwater's parish roll
  item:      { members: [ledger, token, passage, roll] }
  # places the party can search (the `explore` occasion's target domain)
  site:
    members: [mill, tunnel, wagons, coldwater]
    labels: { mill: the mill, tunnel: the smugglers' cut, wagons: the wagons, coldwater: what is left of Coldwater }

relations:
  recruited: { args: [companion], tier: run }
  departed:  { args: [companion], tier: run }
  # who falls in battle is the engine's call, never content's (anyone can fall)
  # it happens only in battle: presence stops assuming it once a battle is over
  fell:      { args: [person], tier: run, reserved: true, changedOn: [battleEnd] }
  inParty:   { args: [companion], derive: true }
  loyal:     { args: [companion], derive: true }

  wronged:   { args: [faction], tier: run }
  # an alliance and a grudge never stand together (dsl 0.25 §1)
  sidedWith: { args: [faction], tier: run, excludes: [wronged] }
  # a companion who travelled with us and fell
  mourned:   { args: [companion], derive: true }
  hostile:   { args: [faction], derive: true }

  knows:     { args: [item], tier: run }

facts:
  - "recruited(isolde)"
  - "recruited(corvin)"
  - "sidedWith(company)"
  - "wronged(dusk)"

rules:
  - "inParty(P) :- recruited(P), not departed(P), not fell(P)"
  # a faction turns on you when you wrong it (a wronged faction is no ally:
  # sidedWith excludes wronged), or when your standing with it sinks far enough
  - "hostile(F) :- wronged(F)"
  - "hostile(F) :- faction(F), cel(\"run.rep[F] <= -3\")"
  - "mourned(P) :- recruited(P), fell(P)"
  - "loyal(P) :- inParty(P), cel(\"run.approval[P] >= 3\")"

defs:
  bridgeOpen: "run.bridge != 'held'"
  wonBattle: "has(run.battle.outcome) && run.battle.outcome == 'won'"
  lostBattle: "has(run.battle.outcome) && run.battle.outcome == 'lost'"
  wrenWithUs: "holds('inParty', ['wren'])"
  # what Maelis will take as proof: the Company's own ledger, or Coldwater's roll
  hasProof: "holds('knows', ['ledger']) || holds('knows', ['roll'])"

cast:
  warden:  { name: The Warden }
  # companions speak only while they travel with the Warden (dsl 0.24 §4).
  # `assume: true`: nobody has fallen until the engine says so (fell is
  # reserved); a line after the battle needs its own guard.
  # Wren is a local before she is a companion: she can speak at the ford
  # before she is recruited, and afterwards only while she travels with us.
  isolde:  { name: Isolde Vane, present: "holds('inParty', ['isolde'])", assume: true, emotions: [neutral, angry, content, sad] }
  corvin:  { name: Corvin, present: "holds('inParty', ['corvin'])", assume: true, emotions: [neutral, delighted, angry] }
  wren:    { name: Wren, present: "holds('inParty', ['wren']) || !holds('recruited', ['wren'])", assume: true, emotions: [neutral, angry, sad] }
  oda:     { name: Oda the Miller }
  maelis:  { name: Maelis of the Dusk }
  brannoc: { name: Captain Brannoc }
