# Four climbs of a fresh save, end to end — the regression test for the
# Hearth's beat ladders, the run boundary (prev.run), and the three quests.
# `engine:` steps write what the engine owns between occasions: floors,
# outcomes, run counters, and the reserved kill facts.
choose:
  firstWords: take
  howAreYou: thanks
  sayIt: say
  kettle: [top, oskar, sable, enough]
  rack: take
steps:
  # ── Run 1: first night ─────────────────────────────────────────────
  - occasion: hubVisit
    expect: { winner: hearth.awakening }
  - occasion: hubVisit
    label: nothing left to say at the Hearth
    expect: { winner: none }
  - occasion: talk
    target: npc.maud
    expect: { winner: maud.first }
  - occasion: talk
    target: npc.oskar
    expect: { winner: oskar.first }
  - occasion: talk
    target: npc.sable
    expect: { winner: sable.first }
  - occasion: talk
    target: npc.sable
    expect: { winner: sableBarkWater }
  - occasion: hearthBoard
    pick: boardChores
    expect: { offered: [boardChores], notOffered: [boardTally, boardForge, boardFeather] }
  - occasion: runStart
    expect: { presented: [stair.firstClimb] }
  - label: the hounds catch her on floor 3
    engine:
      state: { run.floor: 3, run.outcome: fell, run.fellTo: cinderhound, user.runs: { add: 1 }, user.deaths: { add: 1 } }
  - occasion: runEnd
    payload: { lilies: 0 }
    expect: { winner: end.firstFall }
  - newRun: true
  # ── Run 2: the first return ────────────────────────────────────────
  - occasion: hubVisit
    expect: { winner: hearth.firstReturn }
  - occasion: talk
    target: npc.oskar
    label: Oskar asks; Wren is not ready
    choose: { ask: notYet }
    expect: { winner: oskar.coldForgeOffer }
  - occasion: talk
    target: npc.sable
    expect: { winner: sableBarkRuns1 }
  - occasion: talk
    target: npc.maud
    expect: { winner: maudBarkHounds, notOffered: [maudBarkWraith] }
  - occasion: runStart
    expect: { presented: [stair.threshold] }
  - label: the Gatekeeper falls on floor 4
    engine:
      state: { run.floor: 4 }
      facts: ["slew(gatekeeper)", "everSlew(gatekeeper)"]
  - occasion: bossDefeated
    target: boss.gatekeeper
    expect: { winner: boss.gatekeeperFalls }
  - label: a wraith on floor 6
    engine:
      state: { run.floor: 6, run.outcome: fell, run.fellTo: ashwraith, user.runs: { add: 1 }, user.deaths: { add: 1 } }
  - occasion: runEnd
    payload: { lilies: 0 }
    expect: { winner: fallAgain }
  - newRun: true
  # ── Run 3: the feather ─────────────────────────────────────────────
  - occasion: hubVisit
    expect: { winner: hearth.welcomeBack }
  - occasion: talk
    target: npc.oskar
    label: this time she says yes
    choose: { ask: accept }
    expect: { winner: oskar.coldForgeOffer }
  - occasion: talk
    target: npc.oskar
    expect: { winner: oskarBarkGate, offered: [oskar.smallTalk] }
  - occasion: talk
    target: npc.oskar
    expect: { winner: oskar.smallTalk, notOffered: [oskarBarkGate, oskar.coldForgeOffer] }
  - occasion: talk
    target: npc.sable
    expect: { winner: sable.name }
  - occasion: talk
    target: npc.sable
    expect: { winner: sable.feather }
  - occasion: talk
    target: npc.maud
    expect: { winner: maud.count }
  - occasion: hearthBoard
    pick: boardForge
    expect: { offered: [boardFeather, boardForge, boardTally, boardChores] }
  - occasion: runStart
    expect: { presented: [stair.threshold, stair.featherWarm] }
  - label: the Gatekeeper again, maul-head and all
    engine:
      state: { run.floor: 4 }
      facts: ["slew(gatekeeper)"]
  - occasion: bossDefeated
    target: boss.gatekeeper
    expect: { winner: gatekeeperAgain }
  - label: the Warden, floor 9
    engine:
      state: { run.floor: 9 }
      facts: ["slew(warden)", "everSlew(warden)"]
  - occasion: bossDefeated
    target: boss.warden
    expect: { winner: boss.wardenFalls }
  - label: out under the sky
    engine:
      state: { run.outcome: escaped, user.runs: { add: 1 }, user.escapes: { add: 1 } }
  - occasion: runEnd
    payload: { lilies: 0 }
    expect: { winner: end.escape }
  - newRun: true
  # ── Run 4: after the sky ───────────────────────────────────────────
  - occasion: hubVisit
    expect: { winner: hearth.firstEscape, offered: [hearth.veteranWelcome, hearth.welcomeBack] }
  - occasion: hubVisit
    expect: { winner: hearth.veteranWelcome }
  - occasion: hubVisit
    expect: { winner: hearth.welcomeBack }
  - occasion: hubVisit
    expect: { winner: none }
  - occasion: talk
    target: npc.oskar
    choose: { reforge: pay }
    expect: { winner: oskar.hammerhead }
  - occasion: talk
    target: npc.oskar
    expect: { winner: oskar.afterForge }
  - occasion: talk
    target: npc.oskar
    label: Wren takes the hammer off the rack
    expect: { winner: oskar.hammerRack }
  - occasion: talk
    target: npc.oskar
    label: bond 5 — Oskar's keepsake (the template beat)
    expect: { winner: keepsakes.oskar }
  - occasion: talk
    target: npc.oskar
    expect: { winner: oskarBarkForge, notOffered: [oskar.hammerRack, keepsakes.oskar] }
  - occasion: talk
    target: npc.maud
    expect: { winner: keepsakes.maud }
  - occasion: talk
    target: npc.maud
    expect: { winner: maud.questions }
  - occasion: talk
    target: npc.maud
    expect: { winner: maudBarkEscaped }
  - occasion: talk
    target: npc.sable
    expect: { winner: keepsakes.sable }
  - occasion: talk
    target: npc.sable
    expect: { winner: sableBarkNamed, notOffered: [sable.feather] }
  - occasion: departure
    label: all three gave her something and trust her — three send-offs, member order
    expect: { presented: [stairDoor, sendOff, sendOff, sendOff] }
  - occasion: hearthBoard
    label: Wren reads the board and takes nothing
    pick: none
  - occasion: runStart
    expect: { presented: [stair.veteranEcho, stair.oskarBlessing] }
  - label: the hammer is too much on floor 5
    engine:
      state: { run.floor: 5, run.outcome: fell, run.fellTo: ashwraith, user.runs: { add: 1 }, user.deaths: { add: 1 } }
  - occasion: runEnd
    payload: { lilies: 0 }
    expect: { winner: fallAgain }
  - newRun: true
  - occasion: talk
    target: npc.maud
    expect: { winner: maudBarkWraith }
expect:
  end: complete
  quests: { longClimb: complete, coldForge: complete, sableLost: complete, hammerTrial: unset }
  state:
    user.runs: 4
    user.deaths: 3
    user.escapes: 1
    user.embers: 70
    user.hammerReforged: true
    user.bond.maud: 6
    user.bond.oskar: 5
    user.bond.sable: 5
    prev.run.floor: 5
  facts: ["confides(sable)", "saw(sable, featherOut)", "everSlew(warden)", "gave(maud, kettleLid)", "keepsakeFrom(sable)"]
  notFacts: ["slew(warden)"]
  transcriptContains:
    - "The hounds, was it?"
    - "Floor 6 this time."
    - "Floor 6. The steps rush upward."
    - "Forty years and I felt the wind."
    - "Maud drops her cup."
    - "Far below, an anvil rings once, and stops."
  transcriptLacks:
    - "Heard that. All the way down here"
    - "Back before you left?"
