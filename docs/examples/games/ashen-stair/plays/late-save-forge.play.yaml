# A "late save": five climbs in (four falls, one escape), both guardians have
# fallen before, the last climb ended to a wraith on floor 5, and Wren has
# never taken Oskar's quest. Plays the forge quest from the offer to the
# hammer, then Oskar's run challenge to the top.
presented:
  user:
    - hearth.awakening
    - hearth.firstReturn
    - hearth.firstEscape
    - stair.firstClimb
    - end.firstFall
    - boss.gatekeeperFalls
    - boss.wardenFalls
    - maud.first
    - maud.count
    - maud.questions
    - oskar.first
    - sable.first
    - sable.name
quests: { longClimb: complete, sableLost: complete }
entriesRead: { user: [sableBarkRuns1, sableBarkRuns2] }
state:
  user.runs: 5
  user.deaths: 4
  user.escapes: 1
  user.embers: 45
  user.bond.maud: 6
  user.bond.oskar: 1
  user.bond.sable: 5
  user.knowsSableName: true
  prev.run.outcome: fell
  prev.run.floor: 5
  prev.run.fellTo: ashwraith
facts:
  - "everSlew(gatekeeper)"
  - "everSlew(warden)"
  - "saw(sable, gatekeeperFall)"
  - "saw(sable, wardenFall)"
  - "saw(sable, featherOut)"
choose:
  ask: accept
  reforge: pay
  rack: take
steps:
  # ── Run 6: taking the quest ────────────────────────────────────────
  - occasion: hubVisit
    expect: { winner: hearth.veteranWelcome, offered: [hearth.welcomeBack], notOffered: [hearth.awakening] }
  - occasion: talk
    target: npc.maud
    expect: { winner: keepsakes.maud }
  - occasion: talk
    target: npc.maud
    expect: { winner: maudBarkWraith }
  - occasion: talk
    target: npc.oskar
    expect: { winner: oskar.coldForgeOffer, notOffered: [oskar.first] }
  - occasion: talk
    target: npc.oskar
    expect: { winner: oskarBarkGate }
  - occasion: talk
    target: npc.oskar
    expect: { winner: oskar.smallTalk, notOffered: [oskarBarkGate] }
  - occasion: hearthBoard
    pick: boardForge
  - occasion: runStart
    expect: { presented: [stair.veteranEcho] }
  - label: the Gatekeeper, floor 4
    engine:
      state: { run.floor: 4 }
      facts: ["slew(gatekeeper)"]
  - occasion: bossDefeated
    target: boss.gatekeeper
    expect: { winner: gatekeeperAgain }
  - label: the Warden, floor 9
    engine:
      state: { run.floor: 9 }
      facts: ["slew(warden)"]
  - occasion: bossDefeated
    target: boss.warden
    expect: { winner: wardenAgain }
  - label: out under the sky
    engine:
      state: { run.outcome: escaped, user.runs: { add: 1 }, user.escapes: { add: 1 } }
  - occasion: runEnd
    payload: { lilies: 0 }
    expect: { winner: end.escape }
  - newRun: true
  # ── Run 7: the hammer ──────────────────────────────────────────────
  - occasion: hubVisit
    label: second escape — the first story beat after the sky (sequence:)
    expect: { winner: sky.letter }
  - occasion: hubVisit
    expect: { winner: hearth.veteranWelcome, notOffered: [sky.kettleOutside] }
  - occasion: talk
    target: npc.oskar
    expect: { winner: oskar.hammerhead }
  - occasion: talk
    target: npc.oskar
    expect: { winner: oskar.afterForge }
  - occasion: talk
    target: npc.oskar
    expect: { winner: oskar.hammerRack }
  - occasion: runStart
    expect: { presented: [stair.veteranEcho, stair.oskarBlessing] }
  - label: the hammer reaches the top
    engine:
      state: { run.floor: 9 }
  - label: and falls there anyway
    engine:
      state: { run.outcome: fell, run.fellTo: warden, user.runs: { add: 1 }, user.deaths: { add: 1 } }
  - occasion: runEnd
    payload: { lilies: 0 }
    expect: { winner: fallAgain }
expect:
  end: complete
  quests: { coldForge: complete, hammerTrial: complete, longClimb: complete }
  state: { user.embers: 35, user.hammerReforged: true, user.runs: 7, prev.run.outcome: escaped }
  transcriptContains:
    - "Wraith again?"
    - "Heard that. All the way down here, I heard that."
    - "Floor 9. The steps rush upward."
  transcriptLacks:
    - "The forge in the corner is cold."
    - "an anvil rings once"
