# Escaping after both guardians are down completes the climb — judged at
# runEnd, and pays 100 EMBERS (trace applies reward credits since 0.23.1).
file: ../quests/long-climb.lute
facts: ["everSlew(gatekeeper)", "everSlew(warden)"]
state: { run.outcome: escaped }
occasions: [runEnd]
expect:
  quests: { longClimb: complete }
  state: { user.embers: 100 }
  transcriptContains: ["Maud drops her cup."]
  end: complete
