# The Ashen Stair — a climb-die-return roguelike. The engine owns the tower
# (floors, fights, boons, death); Lute owns what the Hearth says about it.
# Engine-owned state is marked `owner: engine` in world.schema.yaml; play
# scripts write it with `engine:` steps (no harness content ships).
pluginsDir: plugins/
defaultProfile: game
profiles:
  game:
    plugins: { game.occasions: true }
identity:
  requireStable: true
defaults:
  luteVersion: "0.38.0"
  contentLang: en-US
  pov: wren
  uses: [world.schema.yaml, vocabulary.schema.yaml]
