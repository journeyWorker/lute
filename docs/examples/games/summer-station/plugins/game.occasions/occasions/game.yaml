# The moments the station engine raises.
occasions:
  # Start of every time slot: the routine, then that slot's event(s).
  slotStart: { select: sequence, description: "A new time slot begins (run.day / run.slot already set); also raised where a run starts" }
  # The player walks somewhere on the station map.
  visit:     { select: first, target: { prefix: place, entity: place }, description: The player goes to a place }
  # The station logbook: past observers' notes, read one at a time.
  logbook:   { select: all, description: The station logbook on the deck desk }
  # The engine closes the day; run.day is NOT yet advanced.
  dayEnd:    { select: first, description: "The day is over (before run.day advances)" }
  # Up on the roof on a clear night, the engine counts the meteors the player
  # calls out. Raised only while Sol is up there under a clear sky.
  shower:
    select: first
    description: A meteor goes over; the count so far rides along
    payload: { count: int }
    raisedWhen: "run.slot == 'night' && run.weather == 'clear' && holds('at', ['sol', 'roof'])"
