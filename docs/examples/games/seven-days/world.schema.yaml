# Seven Days in Marrow Bay — world state.
#
# THE CLOCK IS ENGINE-OWNED. run.day (1..7, day 1 = Monday) and run.slot are
# advanced by the engine; since 0.24 the schema declares them as a `clock:` (the
# slot order, the weekday, where the week ends), and a play script moves them
# with `advance:` steps. Content only reads them (E-ENGINE-OWNED-WRITE).
enums:
  slot:
    members: [morning, afternoon, night]
    labels: { morning: Morning, afternoon: Afternoon, night: Night }

state:
  run.day:  { type: number, default: 1, owner: engine }
  run.slot: { type: { domain: slot }, default: morning, owner: engine }

  # affection routes
  run.aff.ines: { type: number, default: 0 }
  run.aff.theo: { type: number, default: 0 }

  # the festival lantern
  run.lantern.frame: { type: bool, default: false }
  run.lantern.paper: { type: bool, default: false }
  run.lantern.wish:  { type: { enum: [sea, home, someone] } }

  # who you promised to walk the festival with
  run.festivalWith: { type: { enum: [ines, theo, pell] } }

  # Sol's diary: the day each person was last seen (0 = not yet)
  run.seen: { type: number, default: 0, per: person }

  # the post office (0.27 chapter): postcards home, and Mira's franking machine
  run.postcards: { type: number, default: 0 }
  run.machineFixed: { type: bool, default: false }

  # the bus has gone: the game is over
  run.departed: { type: bool, default: false }

  user.endings: { type: number, default: 0 }

clock:
  day: run.day
  slot: run.slot
  slots: [morning, afternoon, night]
  raise: { slot: slotStart, dayStart: dayStart, dayEnd: dayEnd }
  week: { length: 7, first: 0, labels: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday] }
  days: 7          # the last bus leaves on Sunday night: the clock ends there
  # The engine opens a run at Monday morning by raising dayStart (then
  # slotStart) itself — that is when the bus arrives (day1.arrival).
  raiseAtStart: true

terminal: "run.departed"

cast:
  sol:  { name: Sol }
  pell: { name: Aunt Pell }
  ines: { name: Ines }
  theo: { name: Theo }
  mira: { name: Mira }

entities:
  person: { members: [ines, theo, pell, mira] }
  place:
    members: [shop, library, pier, lighthouse, square, post]
    labels: { shop: the lantern shop, library: the library, pier: the pier, lighthouse: the lighthouse, square: the harbour square, post: the post office }
  # who a postcard can go to
  recipient:
    members: [mum, gran, maya]
    labels: { mum: Mum, gran: Gran, maya: Maya }

relations:
  # Where each character can be found right now. Derived from the clock, so the
  # engine can ask `present(C, P)` to populate the town map.
  present: { args: [person, place], derive: true }
  confided: { args: [person], tier: run }
  sentTo: { args: [recipient], tier: run }

rules:
  # Aunt Pell keeps the shop every slot but festival night.
  - "present(pell, shop) :- cel(\"!@festivalNight\")"
  # Ines: library afternoons, Monday to Saturday (closed Sundays).
  - "present(ines, library) :- cel(\"run.slot == 'afternoon' && !@sunday\")"
  # Theo: the pier every morning; the lighthouse on Wednesday night only.
  - "present(theo, pier) :- cel(\"run.slot == 'morning'\")"
  - "present(theo, lighthouse) :- cel(\"clock.weekday == 2 && @night\")"
  # Saturday market (morning + afternoon): both at the square.
  - "present(ines, square) :- cel(\"clock.weekday == 5 && !@night\")"
  - "present(theo, square) :- cel(\"clock.weekday == 5 && !@night\")"
  # Mira: the post office, Monday to Saturday, until the evening post.
  - "present(mira, post) :- cel(\"!@sunday && !@night\")"

defs:
  night:   "run.slot == 'night'"
  sunday:  "clock.weekday == 6"
  today:   "clock.weekdayLabel"
  festivalNight: "run.day == 5 && @night"
  # "on day D in slot S" — the schedule cell, as a parameterised def
  at: { type: bool, params: { d: number, s: string }, cel: "run.day == d && run.slot == s" }
  # Deadlines are clock positions: clock.index = (day - 1) * 3 + slot, with
  # morning 0, afternoon 1, night 2. "Wednesday afternoon is over" is index > 7.
  wedAfternoonOver: "clock.index > 7"
  wedNightOver:     "clock.index > 8"
  friAfternoonOver: "clock.index > 13"
  # the last post: Saturday afternoon is over (Saturday afternoon = index 16)
  lastPostGone:     "clock.index > 16"
  lanternDone: "run.lantern.frame && run.lantern.paper"
