# Ink `{ledger: - 1: … - 2: … - else: …}` ported as a scene counter (the hub flag is a bool, set before the arm runs).
file: ../scenes/keeper.lute
visited: [arrival]
choose: { lamp: [ledger, ledger, ledger, desk, name, dusk] }
expect:
  state: { run.knowsName: true }
  transcriptContains:
    - '@narrator: The last entry is three weeks old. "Oil low. Ship due."'
