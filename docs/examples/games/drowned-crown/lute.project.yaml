# Lute project manifest. The `game` profile activates this project's own
# occasions plugin (plugins/game.occasions): the moments the engine raises,
# which beats answer (dsl 0.21.0).
pluginsDir: plugins/
defaultProfile: game
profiles:
  game:
    plugins: { game.occasions: true }
# Frontmatter every document inherits (dsl 0.10.0 §6): no document repeats
# its language version or its schema imports.
defaults:
  luteVersion: "0.35.0"
  uses: [world.schema.yaml, vocabulary.schema.yaml]
  components: [components/gauge.component.lute, components/keepsake.component.lute, components/bond-story.component.lute]
# The last dive, chained: rail, throne, crown (dsl 0.27.0 §8). The occasion is
# raised only once the crew's stories are told (its `raisedWhen`).
chapters:
  - on: lastDive
    scenes: [last.rail, last.throne, last.crown]
constraints:
  - id: regent-reachable
    kind: reachable
    node: scene:hub.regentFell
  - id: regent-only-at-defeat
    kind: speaksOnlyWhen
    speaker: regent
    when: "occasion.target == 'foe.regent'"
  - id: no-slot-only-progress
    kind: noSingleSlotProgress
    quest: '*'
