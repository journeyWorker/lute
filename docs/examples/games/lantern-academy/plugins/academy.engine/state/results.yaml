stateShapes:
  - name: dateResult
    fields:
      - { name: mood,   type: { enum: [awkward, sweet, perfect] }, default: awkward }
      - { name: hearts, type: number, default: 0 }
  - name: examResult
    fields:
      - { name: grade, type: { enum: [fail, pass, top] }, default: fail }
      - { name: score, type: number, default: 0 }
