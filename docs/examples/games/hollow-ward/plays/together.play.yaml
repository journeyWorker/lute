# The good-not-best night: free-order exploration across four hours, three
# codes, one chase, Tobias out of drawer 13 and through the gate by four.
#
#   lute play . --script plays/together.play.yaml
steps:
  - include: steps/opening.steps.yaml

  # ── 23:00, reception: the roster, the tape, the records key ──
  - occasion: lockedDoor
    target: room.pharmacy
    label: the pharmacy is shut
    expect: { winner: doorPharmacy }
  - occasion: enter
    target: room.reception
  - occasion: read
    target: note.roster
  - occasion: read
    target: note.tape
    expect: { winner: notes.tape, state: { run.sanity: 9 } }
  - occasion: pickup
    engine: { facts: [holding(recordsKey)] }
    target: item.recordsKey

  # ── midnight: the pharmacy keypad ──
  - advance: slot
    expect: { clock: { slot: h00 }, presented: [hours.chime] }
  - occasion: examine
    target: fixture.pharmacyPad
    bridges: { keypad: [ { entered: 1947 } ] }
    expect: { winner: puzzle.pharmacyPad, facts: [solved(pharmacyPad), canEnter(pharmacy)] }
  - occasion: enter
    target: room.pharmacy
  - engine: { facts: [holding(morgueKey), holding(sedative)] }
  - occasion: pickup
    target: item.morgueKey
  - occasion: pickup
    target: item.sedative

  # ── the children's ward: a drawing, a bed card, a torn page ──
  - occasion: enter
    target: room.childrensWard
    choose: { answer: silent }
  - occasion: read
    target: note.drawing
  - occasion: read
    target: note.bedCard
  - occasion: read
    target: note.ledgerPage1

  # ── one o'clock: he comes ──
  - advance: slot
    expect: { clock: { slot: h01 } }
  - occasion: footsteps
    engine: { state: { run.stalker: lobby } }
    target: room.childrensWard
    expect: { winner: orderly.wheels }
  - occasion: encounter
    engine: { state: { run.stalker: childrensWard } }
    target: room.childrensWard
    choose: { react: hide }
    bridges: { evade: [ { outcome: lost } ] }
    expect: { winner: orderly.meet, state: { run.chases: 1, run.fate: alive } }
  - engine: { state: { run.stalker: chapel } }

  # ── records and the morgue: page two, drawer 13 ──
  - occasion: enter
    target: room.records
  - occasion: read
    target: note.ledgerPage2
  - occasion: enter
    target: room.morgue
  - occasion: examine
    target: fixture.freezer
    choose: { drawer: thirteen }
    expect: { winner: puzzle.freezer, facts: [following(tobias)], quests: { findTobias: active } }

  # ── two o'clock: chapel, hydrotherapy ──
  - advance: slot
  - occasion: enter
    target: room.chapel
  - occasion: read
    target: note.hymnBoard
  - occasion: read
    target: note.ledgerPage3
  - occasion: enter
    target: room.hydro
  - occasion: examine
    target: fixture.hydroValves
    choose: { first: blue, second: red, third: drain }
    expect: { facts: [solved(hydroValves)] }
  - occasion: pickup
    target: item.brassKey
    expect: { facts: [canEnter(office)] }

  # ── three o'clock: the office, the safe, and the needle ──
  - advance: slot
    expect: { clock: { slot: h03 } }
  - occasion: enter
    target: room.office
  - occasion: examine
    target: fixture.officeSafe
    bridges: { keypad: [ { entered: 318 } ] }
    expect: { facts: [solved(officeSafe)] }
  - occasion: pickup
    target: item.keycard
  - occasion: encounter
    engine: { state: { run.stalker: office } }
    target: room.office
    choose: { react: needle }
    expect: { winner: orderly.meet, state: { run.chases: 2 } }

  # ── four o'clock: the gate ──
  - advance: slot
    expect: { clock: { slot: h04 } }
  - occasion: enter
    target: room.gate
    expect: { winner: revisits.gate }
  - occasion: examine
    target: fixture.gatePad
    bridges: { keypad: [ { entered: 275 } ] }
    expect: { winner: ending.gate }
expect:
  state: { run.fate: together, run.chases: 2 }
  quests: { findTobias: complete, beforeDawn: complete, quietWard: unset }
  facts: [following(tobias)]
  transcriptContains:
    - "@tobias: ...Nell? They said I had to be in bed by three."
    - "@tobias: Don't look back. Don't. I looked back once tonight and look where it got me."
  transcriptLacks: ["Night night, nurse."]
