# The moments the Hollow Ward engine raises.
occasions:
  # the night starts: the car, the gate, the lobby door
  nightFalls:  { select: sequence, description: "A new game: 23:00, the player at the gate" }
  # the clock (world.schema.yaml clock.raise)
  hourStrikes: { select: sequence, description: "The hour changes where an advance stops (run.hour already set)" }
  dawn:        { select: first, description: "The last hour runs out: the sun comes up over the ward (the clock's last dayEnd)" }
  # the map: the engine opens a door only when canEnter(<room>) holds
  enter:       { select: first, target: { prefix: room, entity: room }, raisedWhen: "holds('canEnter', [occasion.target])", description: "The player walks into a room (room.<room>)" }
  lockedDoor:  { select: first, target: { prefix: room, entity: room }, raisedWhen: "!holds('canEnter', [occasion.target])", description: "The player tries a door the engine keeps shut" }
  # things
  pickup:      { select: first, target: { prefix: item, entity: item }, raisedWhen: "holds('holding', [occasion.target])", description: "The player picks an item up; holding(<item>) is already asserted" }
  examine:     { select: first, target: { prefix: fixture, entity: fixture }, description: "The player inspects a fixture (a keypad, a safe, a tub, a freezer)" }
  read:        { select: first, target: { prefix: note, entity: note }, description: "The player reads a note, a page or a tape" }
  # the Orderly
  encounter:   { select: first, target: { prefix: room, entity: room }, raisedWhen: "run.stalker == occasion.target", description: "The Orderly reaches the room the player is in" }
  sanityBreak: { select: first, raisedWhen: "run.sanity <= 0", description: "run.sanity reached 0" }
  # the Orderly is one room away: close(<room>) joins run.stalker with the
  # door graph (world.schema.yaml)
  footsteps:   { select: first, target: { prefix: room, entity: room }, raisedWhen: "holds('close', [occasion.target])", description: "The Orderly is one room away from the player (room.<the player's room>)" }
  # the isolation wing (0.27 chapter)
  # the lift judders to a stop between floors (three times on the way down)
  liftStops:   { select: first, description: "The lift stops between floors on the way down to isolation" }
  # the power dips while the boiler strains; the engine says for how long
  lightsFlicker: { select: sequence, payload: { seconds: int }, description: "The lights go out for a few seconds" }
