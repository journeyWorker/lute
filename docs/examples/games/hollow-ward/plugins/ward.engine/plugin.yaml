# The Hollow Ward engine pack. The ENGINE runs the map, the doors, the
# inventory, the sanity meter, the stalker's pathing and the chase minigame,
# and the keypads. Lute declares what the story says when the engine raises a
# moment, and what that moment changes.
id: ward.engine
version: 0.1.0
kind: capability
depends: [ { id: lute.core, range: "^0.0.1" } ]
exports:
  occasions: occasions/
  directives: directives/
  bridge: bridge/
  state: state/
