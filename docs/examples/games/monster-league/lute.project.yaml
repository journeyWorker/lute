# Monster League — a monster-collecting RPG in the Verdane region.
#
# LEAD-OWNED. The `league` profile activates the engine pack in
# plugins/league.engine: the occasions the engine raises, its world events,
# reward kinds, the battle bridge, the passthrough engine calls, and the cast
# (one cast file per area). See AREAS.md for who owns what.
pluginsDir: plugins/
defaultProfile: league
profiles:
  league:
    plugins: { league.engine: true }
identity:
  requireStable: true
defaults:
  luteVersion: "0.36.5"
  # world contract, split by concern (a name may be declared in only one)
  uses:
    - schema/world.schema.yaml
    - schema/species.schema.yaml
    - schema/roster.schema.yaml
    - schema/vocabulary.schema.yaml
    - schema/items.schema.yaml
    # area-private declarations and the area's roster members, one file per
    # area (AREAS.md §1); a new area needs no edit here
    - schema/areas/*.schema.yaml
  # every quest in this game is a run quest (a <quest> may still write tier=)
  questTier: run
  # shared components: every document can ::use them without importing
  components:
    - components/trainer-battle.component.lute
    - components/gym-leader.component.lute
    - components/rival-battle.component.lute
    - components/obtain.component.lute
    - components/nurse.component.lute
    - components/shop.component.lute
    - components/beacon-keeper.component.lute
# the new game: the professor's opening, then waking at home, both in the one
# newGame raise (select: sequence); `chapters:` derives their on:/priority:
chapters:
  - { on: newGame, scenes: [spine.opening, spine.home] }
