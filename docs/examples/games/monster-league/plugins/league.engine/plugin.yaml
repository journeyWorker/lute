# The Monster League engine pack (LEAD-OWNED except cast/<area>.yaml).
# What the engine raises (occasions), what quests hear (events), what it pays
# (reward kinds), and the engine calls content makes: ::battle hands a fight to
# the battle system and waits for the outcome (a bridge); ::encounter, ::heal,
# ::shop and ::give are fire-and-forget passthroughs.
id: league.engine
version: 0.1.0
kind: capability
depends: [ { id: lute.core, range: "^0.0.1" } ]
exports:
  occasions: occasions/
  events: events/
  rewardKinds: rewardkinds/
  directives: directives/
  bridge: bridge/
  state: state/
  cast: cast/
