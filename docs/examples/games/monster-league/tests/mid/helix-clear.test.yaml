# Helix Tower in one go, after east lifted the siege: every floor, Kai beaten,
# Admin Maelis beaten; the lair cleared and the Mind Gym door open. (The
# retry and Kai-wins paths are in plays/mid.play.yaml: a scenario test stops
# at a taken ::jump.)
file: ../../scenes/mid/helix-tower.lute
state: { run.lair.towerSiege: cleared }
bridges: { battle: [ { won: true }, { won: true }, { won: true }, { won: true }, { won: true }, { won: true } ] }
expect:
  end: complete
  facts: [hasItem(cardKey), rivalFought(tower), rivalBeaten(tower), defeated(gruntHelix), canPass(mindGymDoor)]
  state: { run.lair.helixHQ: cleared, run.rivalStanding: 1 }
  transcriptContains: ["Helix Corp thanks you. I'm taking this badge off right now.", "Fine, you win. Just go upstairs and finish it."]
  transcriptLacks: ["Somewhere above, a grunt is laughing."]
