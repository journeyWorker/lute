# The spine: a new save, the starter, every area's contract beats in map
# order, the Elite Four (with one broken streak), the Champion, the Hall of
# Fame, the morning after and the Rift Cavern.
#
#   lute play . --script plays/spine.play.yaml
#
# LEAD-OWNED. Each area owns its plays/steps/<area>*.steps.yaml: keep the
# final step's `expect:` (the hand-off) green; add steps before it freely.
# Rules for included steps: answer every ::battle with a step-level
# `bridges:`; put `choose:` on the step, never at the top level.
choose:
  homeWake: go
  starter: cindle
steps:
  # ── Hollowtown ────────────────────────────────────────────────────────
  - occasion: newGame
    label: a new save
    expect: { presented: [spine.opening, spine.home], quests: { league: active, badgeRoad: active, eliteFour: active, eclipseArc: unset } }
  - occasion: talk
    target: npc.mom
    expect: { winner: momMorning }
  - occasion: enterPlace
    target: place.profLab
    label: the lab
    bridges: { battle: [ { won: true } ] }
    expect:
      winner: spine.lab
      facts: [chose(cindle), rivalChose(dewpup), hasItem(monDex), rivalFought(lab), rivalBeaten(lab)]
      quests: { dexProject: active, dex10: active, dex40: unset, rivalry: active }
      state: { run.rivalStanding: 1, run.money: 3000 }
  - label: the engine hands over the starter
    engine: { facts: [caught(cindle), seen(cindle), inParty(cindle)] }

  # ── the areas, in map order ───────────────────────────────────────────
  - include: steps/south.steps.yaml
  - include: steps/east-coast.steps.yaml
  - include: steps/mid-city.steps.yaml
  - include: steps/east-tower.steps.yaml
  - include: steps/mid-tower.steps.yaml
  - include: steps/north.steps.yaml

  # ── the Summit League ─────────────────────────────────────────────────
  - occasion: enterPlace
    target: place.summitPlateau
    expect: { winner: spine.plateau }
  - occasion: challenge
    target: arena.frostChamber
    bridges: { battle: [ { won: true } ] }
    expect: { winner: spine.elite.frostine, facts: [defeated(frostine)] }
  - occasion: challenge
    target: arena.fistChamber
    label: Tarrok wins; the streak breaks
    bridges: { battle: [ { won: false } ] }
    expect: { winner: spine.elite.tarrok, notFacts: [defeated(frostine), defeated(tarrok)], quests: { eliteFour: active } }
  - occasion: blackout
    expect: { winner: spine.blackout }
  - occasion: challenge
    target: arena.fistChamber
    label: Tarrok's door stays shut until Frostine falls again
    expect: { winner: none }
  - occasion: challenge
    target: arena.frostChamber
    bridges: { battle: [ { won: true } ] }
    expect: { winner: spine.elite.frostine }
  - occasion: challenge
    target: arena.fistChamber
    bridges: { battle: [ { won: true } ] }
    expect: { winner: spine.elite.tarrok }
  - occasion: challenge
    target: arena.shadeChamber
    bridges: { battle: [ { won: true } ] }
    expect: { winner: spine.elite.morwen }
  - occasion: challenge
    target: arena.dragonChamber
    bridges: { battle: [ { won: true } ] }
    expect: { winner: spine.elite.drakon, facts: [beatElite(frostine), beatElite(tarrok), beatElite(morwen), beatElite(drakon)], quests: { eliteFour: complete } }
  - occasion: challenge
    target: arena.championHall
    label: the Champion
    bridges: { battle: [ { won: true } ] }
    expect:
      winner: spine.champion
      facts: [rivalFought(champion), rivalBeaten(champion)]
      quests: { league: complete, rivalry: complete, legacy: active }
  - occasion: hallOfFame
    expect: { winner: spine.hallOfFame, state: { user.hallOfFame: 1 } }

  # ── the morning after, and the postgame ───────────────────────────────
  - advance: day
    label: home again
  - occasion: enterPlace
    target: place.riftCavern
    expect: { winner: spine.rift }
  - label: the engine's catch
    engine: { facts: [caught(aethon), seen(aethon), inParty(aethon)] }
  - occasion: caught
    target: mon.aethon
    expect: { winner: spine.caughtAethon, quests: { legacy: complete } }
expect:
  end: complete
  quests: { league: complete, badgeRoad: complete, eclipseArc: complete, eliteFour: complete, rivalry: complete, legacy: complete, dex10: complete, dex40: active }
  state: { user.hallOfFame: 1 }
  facts: [canPass(victoryRoadGate), canPass(victoryRoadBoulders), caughtLegend(aethon)]
  transcriptContains:
    - "@vex: Citizens of Verdane. Forgive the interruption. I am Director Vex, of Team Eclipse."
    - "@vex: Team Eclipse is finished. I am finished with it."
    - "@announcer: Radio Verdane, with the news: Team Eclipse has disbanded. Helix Tower has reopened to the public."
    - "@rival: NO! That can't be! You beat my best! After all that work, my reign is over already."
    - "@narrator: The Summit League records a new Champion"
    - "@mom: And the professor called."
    - "@profAlder: Aethon. I spent my whole life believing it was a story."
