# A second go at the hideout after losing in the vault corridor. A scenario
# test cannot cover this: `lute trace` / `lute test` stop at a taken ::next
# (the skipped stair guard) and still report the walk complete, so the retry
# is a play (see FINDINGS-mid M3).
#
#   lute play . --script plays/mid-corner-retry.play.yaml
state: { run.lair.cornerHideout: found }
facts: [defeated(cornerGruntDoor)]
steps:
  - occasion: enterPlace
    target: place.gameCorner
    label: the stair guard is skipped; the scientist wins
    bridges: { battle: [ { won: true }, { won: false } ] }
    expect:
      winner: mid.gameCorner
      facts: [defeated(cornerGruntVault)]
      notFacts: [defeated(cornerScientistLoy), hasItem(spectralLens)]
      state: { run.lair.cornerHideout: found }
  - occasion: enterPlace
    target: place.gameCorner
    label: third time lucky
    bridges: { battle: [ { won: true }, { won: true } ] }
    expect:
      winner: mid.gameCorner
      facts: [defeated(cornerScientistLoy), defeated(gruntCorner), hasItem(spectralLens)]
      state: { run.lair.cornerHideout: cleared }
  - occasion: enterPlace
    target: place.gameCorner
    label: the hideout is empty now
    expect: { winner: midCornerCasinoAfter }
expect:
  transcriptContains: ["Fascinating. You are exactly as weak as I predicted.", "Nobody noticed you were gone.", "received the Spectral Lens!"]
  transcriptLacks: ["Was it Hesketh?"]
