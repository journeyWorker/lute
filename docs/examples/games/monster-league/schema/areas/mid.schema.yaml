# OWNED BY AREA mid: area-private state, enums, relations, defs.
# Every name declared here starts with the area: run.midX, user.midX,
# enum/kind/relation/def midX. Other areas never read it; anything another
# area needs goes into the world contract (ask the lead).
state:
  # ── the Wildmoor bug-catching contest (Tue / Thu / Sat, morning or day) ──
  # closed -> entered at the desk; back to closed when the bell rings (slotStart)
  run.midContest:      { type: { enum: [closed, entered] }, default: closed }
  # the best catch of today's entry: 0 nothing, 1 common, 2 fine, 3 rare
  run.midContestScore: { type: number, default: 0 }
  # first prizes so far
  run.midContestWins:  { type: number, default: 0 }
  # the day of the last entry (one entry a day)
  run.midContestDay:   { type: number, default: 0 }

entities:
  # the bug-catching contest's prize tiers (the twelve bug species); the
  # contest's caught beats target these kinds (target="kind:midBugRare")
  midBugRare:   { subsetOf: species, members: [hornbeetle, bladebug] }
  midBugFine:   { subsetOf: species, members: [papillume, waspire, sporeshroom, mothfuzz, dustmoth] }
  midBugCommon: { subsetOf: species, members: [inchlet, cocoonix, stingle, husklet, sporemite] }
  person:
    add:
      # mid named NPCs (cast/mid.yaml) and signposts (narrator)
