      - silvercrestDeptStore
      - silvercrestTheater
      - wardenmereWell
      - fairhavenLighthouse
      - fairhavenDayCare

  # the three haunts of Madame Oriel's ghost stories; the Spectral Lens shows
  # what is in them
  midHaunt: { subsetOf: place, members: [silvercrestTheater, wardenmereWell, fairhavenLighthouse] }

relations:
  # a ghost seen through the Spectral Lens at one of the haunts
  midGhostSeen: { args: [midHaunt], tier: run }

defs:
  # the desk takes entries on contest days until night falls
  midContestOpen:  "@contestDay && run.slot != 'night'"
  # already entered today (whether or not the bell has rung)
  midContestToday: "run.midContestDay == run.day"
