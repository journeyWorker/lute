# docs/examples/episodes/lute.project.yaml
# The two-file project the `first-scene` tutorial builds in Part 5, as a
# runnable example a reader can diff their own `episodes/` folder against.
# Core-only, exactly the one-line manifest the page shows.
defaultProfile: core
profiles:
  core:
    plugins: {}

# Identity templates (dsl §10). `{prefix}.{speaker}-{code}` is the default
# voiceKey since dsl 0.22.0 (pinned here for older toolchains): without the scene
# prefix, two documents' lines with the same speaker and code would share one
# voice asset (E-DUP-VOICEKEY).
identity:
  voiceKey: "{prefix}.{speaker}-{code}"
