# docs/examples/episodes/lute.project.yaml
# The two-file project the `first-scene` tutorial builds in Part 5, as a
# runnable example a reader can diff their own `episodes/` folder against.
# Core-only, exactly the one-line manifest the page shows.
defaultProfile: core
profiles:
  core:
    plugins: {}

# Identity templates (dsl §10). The default voiceKey `{speaker}-{code}` has no
# `{prefix}`, so two documents' lines with the same speaker and code would share
# one voice asset (E-DUP-VOICEKEY); the scene prefix keeps them apart.
identity:
  voiceKey: "{prefix}.{speaker}-{code}"
