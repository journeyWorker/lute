# Orca per-workspace environments. "Kata Sandbox" runs the workspace in a
# fresh Kata VM from the intranet agent-sandbox warm pool (forca-rust) and
# releases it when the workspace is deleted. checkoutMode provisioned-root:
# the workspace is the sandbox's own checkout (submodules, LFS assets, caches,
# .env prepared by the recipe), on the branch Orca creates.
#
# The recipe is the `forca` CLI (KantoRegion/forca, `bun add -g @kantoregion/forca`);
# there are no scripts in this repo. Options: README of KantoRegion/forca.
environmentRecipes:
  - id: kata
    name: Kata Sandbox
    checkoutMode: provisioned-root
    create: forca recipe create --pool forca-rust
    destroy: forca recipe delete
