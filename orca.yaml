# Managed by KantoRegion/forca (recipe/orca.yaml). Edit it there and run
# `forca sync`; local edits are overwritten.
#
# Orca per-workspace environments. "Kata Sandbox" runs the workspace in a
# fresh Kata VM from the intranet agent-sandbox warm pool (omp-kata-rust) and
# releases it when the workspace is deleted. checkoutMode provisioned-root:
# the workspace is the sandbox's own checkout (submodules, LFS assets, caches,
# .env prepared by the recipe), on the branch Orca creates.
environmentRecipes:
  - id: kata
    name: Kata Sandbox
    checkoutMode: provisioned-root
    create: ./scripts/orca-vm/kata-create.sh
    destroy: ./scripts/orca-vm/kata-destroy.sh
