# omp defaults for Kata sandboxes, installed as ~/.omp/agent/config.yml by
# kata-create.sh. Derived from the operator's desktop config, minus anything
# secret or desktop-bound (mnemopi + its API key, autolearn, computer use,
# browser relay to the desktop Chrome). Model credentials come from the
# in-cluster omp-auth-broker, not from here.
#
# Managed by KantoRegion/forca (omp/config.yml). Edit it there and run
# `forca sync`; local edits in a consumer repo are overwritten.
setupVersion: 2
startup:
  setupWizard: false
symbolPreset: nerd
theme:
  dark: titanium
  light: light
modelRoles:
  smol: openai-codex/gpt-6.1-sol
  slow: anthropic/claude-opus-5-5
  tiny: openai-codex/gpt-6-luna
  vision: openai-codex/gpt-6.1-sol
  task: anthropic/claude-sonnet-5-5
  plan: anthropic/claude-fable-5-1
  web: web/firecrawl
  image: openai-codex/gpt-image-2
  SONNET: anthropic/claude-sonnet-5-5
  grok: xai-oauth/grok-4.7
  default: anthropic/claude-opus-5-5
dev:
  autoqaConsent: denied
task:
  agentModelOverrides:
    reviewer: openai-codex/gpt-6-astra
    scout: openai-codex/gpt-6.1-sol
    sonic: anthropic/claude-sonnet-5-5
    task: anthropic/claude-sonnet-5-5
    task-force-worker: anthropic/claude-sonnet-5-5
    task-force-gpt: openai-codex/gpt-6.1-sol
    lead-orchestrator: anthropic/claude-opus-5-5
    lead: anthropic/claude-opus-5-5
    ace-engineer: anthropic/claude-sonnet-5-5
  softRequestBudget: 150
  enableLsp: true
  eager: preferred
  maxConcurrency: 0
  disabledAgents: []
disabledExtensions:
  - skill:humanizer
  - skill:figma-swiftui
browser:
  headless: true
  enabled: true
statusLine:
  preset: default
  compactThinkingLevel: true
  showHookStatus: true
  transparent: false
  sessionAccent: true
  separator: powerline-thin
steeringMode: one-at-a-time
interruptMode: immediate
loop:
  mode: prompt
doubleEscapeAction: tree
autocompleteMaxVisible: 5
magicKeywords:
  orchestrate: true
  jevify: true
compaction:
  thresholdPercent: 60
  handoffSaveToDisk: true
  methodOrder:
    - shake
    - snapcompact
    - remote
    - soft
    - handoff
ttsr:
  contextMode: discard
edit:
  mode: hashline
  fuzzyMatch: true
  fuzzyThreshold: 0.95
bash:
  autoBackground:
    enabled: true
shellMinimizer:
  enabled: true
hideThinkingBlock: true
generate_image:
  enabled: true
launch:
  enabled: true
astGrep:
  enabled: true
github:
  enabled: true
composer:
  shape: band
extendedContext: true
defaultThinkingLevel: medium
spelling:
  autocomplete: "off"
  typoDetection: false
checkpoint:
  enabled: true
codexResets:
  autoRedeem: "no"
