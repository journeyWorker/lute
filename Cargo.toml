[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.47.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10.7"
schemars = "1"
insta = { version = "1", features = ["yaml"] }
tempfile = "3.27"

# Tests, CI gates and the conformance harness run the dev binary over every
# dogfood game; at opt-level 0 their runtime dwarfs the compile. Level 1 keeps
# debug assertions and overflow checks and runs the corpus several times faster.
[profile.dev]
opt-level = 1
